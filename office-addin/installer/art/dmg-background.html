<!--
  Office 插件 DMG 安装窗口背景（660x420，1x/2x PNG 入库，构建时 tiffutil 合成 hidpi TIFF）。
  与桌面端 desktop/build/dmg-background.html 同一套视觉语言。改完跑 `node installer/render-art.mjs`。
  图标落位见 build-installers.mjs 的 Finder 排版脚本：安装器 app 居中 (330, 200)，
  manifest.xml 兜底文件收在右侧 (572, 316)。两者必须与本图的光晕/文案一起改。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 420px; overflow: hidden; }

  body {
    position: relative;
    background:
      radial-gradient(600px 360px at 10% 120%, rgba(91, 209, 151, 0.26) 0%, rgba(91, 209, 151, 0) 64%),
      radial-gradient(640px 400px at 102% 58%, rgba(26, 83, 54, 0.14) 0%, rgba(26, 83, 54, 0) 62%),
      linear-gradient(180deg, #FAFCFB 0%, #F0F6F2 58%, #E6F0EA 100%);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .band {
    position: absolute; top: 0; left: 0;
    width: 660px; height: 104px;
    overflow: hidden;
    background:
      radial-gradient(420px 220px at 88% -24%, rgba(91, 209, 151, 0.36) 0%, rgba(91, 209, 151, 0) 68%),
      linear-gradient(112deg, #0E3320 0%, #174C31 54%, #1D6440 100%);
  }
  .band-rule {
    position: absolute; top: 102px; left: 0;
    width: 660px; height: 2px;
    background: linear-gradient(90deg,
      rgba(91,209,151,0) 0%, #5BD197 24%, #A6EFCA 50%, #5BD197 76%, rgba(91,209,151,0) 100%);
  }
  .band-traces {
    position: absolute; left: 0; top: 4px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 14%, transparent 32%, transparent 68%, #000 86%, #000 100%);
  }

  .wordmark {
    position: absolute; top: 30px; left: 0; width: 100%;
    text-align: center;
    font-size: 25px; font-weight: 600; letter-spacing: 0.005em;
    color: #FFFFFF;
  }
  .tagline {
    position: absolute; top: 68px; left: 0; width: 100%;
    text-align: center;
    font-size: 11.5px; font-weight: 400; letter-spacing: 0.16em;
    color: rgba(220, 248, 234, 0.78);
  }

  /* 安装器图标落位光晕（图标中心 330, 200，iconSize 112） */
  .halo {
    position: absolute; top: 96px; left: 226px;
    width: 208px; height: 208px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.80) 40%, rgba(255,255,255,0) 70%);
  }

  .caption {
    position: absolute; top: 296px; left: 0; width: 100%;
    text-align: center;
    font-size: 14px; font-weight: 500; letter-spacing: 0.04em;
    color: #1A5336;
  }
  .caption-sub {
    position: absolute; top: 320px; left: 0; width: 100%;
    text-align: center;
    font-size: 11.5px; letter-spacing: 0.03em;
    color: rgba(15, 46, 30, 0.5);
  }

  /* manifest.xml 兜底文件的注脚：放在图标正上方（图标中心 572, 316，上缘约 260），
     与居中的 caption/caption-sub 两行错开，也避开 Finder 底部状态栏 */
  .fallback-note {
    position: absolute; top: 226px; right: 24px;
    width: 130px; text-align: center;
    font-size: 10px; line-height: 1.5; letter-spacing: 0.02em;
    color: rgba(15, 46, 30, 0.38);
  }
</style>
</head>
<body>
  <div class="band">
    <svg class="band-traces" width="660" height="96" viewBox="0 0 660 96" fill="none"
         stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round">
      <path d="M-10 22 H70 L84 36 H176"/>
      <path d="M-10 58 H36 L50 44 H144"/>
      <path d="M-10 86 H108 L122 72 H186"/>
      <path d="M670 28 H592 L578 42 H486"/>
      <path d="M670 64 H626 L612 50 H516"/>
      <path d="M670 88 H556 L542 74 H474"/>
      <g fill="rgba(166,239,202,0.42)" stroke="none">
        <circle cx="176" cy="36" r="2"/>
        <circle cx="144" cy="44" r="2"/>
        <circle cx="486" cy="42" r="2"/>
        <circle cx="474" cy="74" r="2"/>
      </g>
    </svg>
    <div class="wordmark">AI WorkDeck Office 插件</div>
    <div class="tagline">在 WORD · EXCEL · POWERPOINT 中使用 AI WORKDECK</div>
  </div>
  <div class="band-rule"></div>

  <div class="halo"></div>

  <div class="caption">双击上方图标，开始安装</div>
  <div class="caption-sub">安装器会引导完成全部步骤；如遇系统授权提示，按窗口内指引操作即可</div>

  <div class="fallback-note">手动安装兜底文件<br>一般无需理会</div>
</body>
</html>
