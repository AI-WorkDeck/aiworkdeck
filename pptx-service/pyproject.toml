[project]
name = "banana-slides"
version = "0.3.0"
description = "Banana Slides – AI native PPT generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<3.2",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.1",
    "google-genai>=1.52.0",
    "openai>=1.0.0",
    "pydantic>=2.9.0",
    "pillow>=13.0.0",
    "python-pptx>=1.0.0",
    "python-dotenv>=1.2.2,<1.3",
    "reportlab>=4.1.0",
    "werkzeug>=3.1.9,<3.2",
    "markitdown[all]",
    "tenacity>=9.0.0",
    "alembic>=1.13.0",
    "flask-migrate>=4.0.0",
    "img2pdf>=0.5.1",
    "lazyllm>=0.7.3",
    "volcengine-python-sdk[ark]>=5.0.9",
    "PyPDF2>=3.0.0",
    "PyMuPDF>=1.24.0",
    "pdf2docx>=0.5.13",  # [checkba] /api/pdf/to-docx；连带 pymupdf / opencv-python-headless
]

[project.optional-dependencies]
lazyllm = [
    "lazyllm",
    "dashscope",
    "zhipuai",
]
test = [
    "pytest>=9.0.3,<9.1",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
]
sdk = [
    "dashscope",
    "volcengine-python-sdk",
    
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# [checkba] 安全下限。re-vendor 后必须保留，否则 uv lock 会把这些传递依赖解回有洞的版本。
constraint-dependencies = [
    "certifi>=2026.10.18",
    "pyjwt>=2.14.0",
    "lxml>=6.1.0",
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.5",
    "anyio>=4.14.2",
    "aiohttp>=3.14.4",
    "azure-core>=1.38.0",
    "deepdiff>=8.6.2,<9",
    "protobuf>=6.33.5,<7",
    "soupsieve>=2.8.4,<3",
    "mako>=1.3.12",
    "filelock>=4.2.1",
    "black>=26.10.1",
    "werkzeug>=3.1.9,<3.2",
    "flask>=3.1.3,<3.2",
    "python-dotenv>=1.2.2,<1.3",
    "pytest>=9.0.3,<9.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
