    <radialGradient id="glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#ffffff" stop-opacity=".07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ink)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <path d="M150 104 h160 l62 62 v226 a16 16 0 0 1 -16 16 h-206 a16 16 0 0 1 -16 -16 v-272 a16 16 0 0 1 16 -16z" fill="#F3ECE0"/>
