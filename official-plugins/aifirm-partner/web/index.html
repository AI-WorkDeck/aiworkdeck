<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event Lead Portal</title>
  <link rel="stylesheet" href="panel.css">
  <script src="awd-plugin-sdk.js"></script>
  <script src="panel-l10n.js"></script>
  <script src="firm.js"></script>
  <script src="panel.js" defer></script>
  <!-- us-framing:start --><script src="framing.js" defer></script><!-- us-framing:end -->
  <script src="matters.js" defer></script>
</head>
<body>
  <main class="awd-plugin-stage elp">
    <header class="awd-plugin-header">
      <div>
        <div class="awd-eyebrow" data-i18n="panel.eyebrow"></div>
        <h1 class="awd-title" id="title"></h1>
        <p class="awd-subtitle" data-i18n="panel.subtitle"></p>
      </div>
      <div class="awd-header-actions">
        <span id="leads-actions" class="awd-header-actions" hidden>
          <button type="button" id="btn-qr" class="awd-btn awd-btn-sm" data-i18n="panel.qr" disabled></button>
          <button type="button" id="btn-export" class="awd-btn awd-btn-sm" data-i18n="panel.export" disabled></button>
        </span>
        <span id="mp-sub-badge" class="awd-badge awd-badge-success mp-sub-badge" hidden></span>
        <button type="button" id="btn-profile" class="awd-btn awd-btn-sm" data-i18n="panel.m.mp.profileBtn" hidden></button>
        <a id="m-client-link" class="awd-btn awd-btn-sm" target="_blank" rel="noopener" data-i18n="panel.m.clientLink" hidden></a>
        <button type="button" id="btn-refresh" class="awd-btn awd-btn-sm" data-i18n="panel.refresh"></button>
      </div>
    </header>

    <nav id="mode" class="awd-subnav mode" aria-label="View">
      <button type="button" class="awd-subnav-item" data-mode="matters" data-i18n="panel.mode.matters"></button>
      <button type="button" class="awd-subnav-item" data-mode="leads" data-i18n="panel.mode.leads"></button>
    </nav>

    <div id="notice" hidden></div>
    <div id="m-notice" hidden></div>

    <section id="matters" hidden>
      <nav id="m-office" class="awd-subnav office" aria-label="Office"></nav>

      <div id="m-paywall" class="mp-paywall" hidden></div>

      <div id="m-subscribed" class="mp-subscribed" hidden>
        <nav id="mp-tabs" class="awd-subnav mp-tabs" aria-label="Marketplace"></nav>
        <div id="mp-profile-banner" class="awd-notice awd-notice-warning mp-profile-banner" hidden></div>

        <section id="mp-plaza" class="mp-view" hidden>
          <div id="mp-plaza-kpis" class="awd-kpi-grid"></div>
          <div class="split">
            <div id="mp-plaza-list" class="list" role="listbox"></div>
            <article id="mp-plaza-detail" class="awd-card detail"></article>
          </div>
        </section>

        <section id="mp-bids" class="mp-view" hidden>
          <div id="mp-bids-list" class="mp-bids-grid"></div>
        </section>

        <!-- us-framing:start -->
        <section id="mp-framing" class="mp-view" hidden>
          <div class="split">
            <div id="fr-list" class="list" role="listbox"></div>
            <article id="fr-detail" class="awd-card detail framing"></article>
          </div>
        </section>
        <!-- us-framing:end -->

        <section id="mp-desk" class="mp-view" hidden>
          <div id="m-kpis" class="awd-kpi-grid"></div>
          <div class="toolbar">
            <nav id="m-status" class="awd-subnav" aria-label="Status"></nav>
            <input id="m-search" class="awd-input" type="search">
          </div>
          <div class="split">
            <div id="m-list" class="list" role="listbox"></div>
            <article id="m-detail" class="awd-card detail"></article>
          </div>
        </section>
      </div>
    </section>

    <div id="leads-view" hidden>
    <section id="board" hidden>
      <div id="kpis" class="awd-kpi-grid"></div>

      <div class="toolbar">
        <select id="event" class="awd-select" aria-label="Event" hidden></select>
        <nav id="topics" class="awd-subnav" aria-label="Topics"></nav>
        <select id="status" class="awd-select"></select>
        <input id="search" class="awd-input" type="search">
      </div>
      <label class="anon"><input type="checkbox" id="anon"> <span data-i18n="panel.filter.anon"></span></label>

      <div class="split">
        <div id="list" class="list" role="listbox"></div>
        <article id="detail" class="awd-card detail"></article>
      </div>
    </section>
    </div>

    <div id="m-dialog" class="overlay" hidden><div class="awd-card dialog wide" role="dialog" aria-modal="true"></div></div>

    <div id="qr-dialog" class="overlay" hidden>
      <div class="awd-card dialog" role="dialog" aria-modal="true" aria-labelledby="qr-title">
        <h2 id="qr-title" class="awd-card-title" data-i18n="panel.qr.title"></h2>
        <p class="muted" data-i18n="panel.qr.desc"></p>
        <div id="qr-svg" class="qr"></div>
        <code id="qr-url" class="url"></code>
        <div class="row">
          <button type="button" id="qr-copy" class="awd-btn awd-btn-sm" data-i18n="panel.qr.copy"></button>
          <button type="button" id="qr-close" class="awd-btn awd-btn-sm awd-btn-primary" data-i18n="panel.qr.close"></button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
