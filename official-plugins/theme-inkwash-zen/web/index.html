<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>东方水墨 · 飞白禅圆</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--awd-font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
      background: var(--awd-bg, #F4F1EA);
      color: var(--awd-text, #1A1816);
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--awd-surface, #FAF8F3);
      border: 1px solid var(--awd-border, #D4CFC3);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--awd-shadow-sm, 0 1px 2px rgba(0,0,0,0.06));
    }
    .title {
      font-family: var(--awd-font-serif, "Songti SC", serif);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--awd-text-2, #524E48);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }
    .swatch {
      border: 1px solid var(--awd-border, #D4CFC3);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .swatch-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-bottom: 8px;
      border: 1px solid rgba(128,128,128,0.25);
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--awd-accent-soft, #EAE6F2);
      color: var(--awd-accent-text, #514170);
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">UI 皮肤插件 · Skin 02</span>
    <h1 class="title" style="margin-top:10px">东方水墨 · 一笔禅圆</h1>
    <p class="subtitle">计白当黑，墨分五色（焦、浓、重、淡、清），怀中一滴紫墨自然润开，配以朱砂印泥语义警示。</p>
    <div class="swatches">
      <div class="swatch"><div class="swatch-dot" style="background:#F4F1EA"></div><strong>生宣留白</strong><div>#F4F1EA</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#1A1816"></div><strong>焦墨正文</strong><div>#1A1816</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#5B4B7A"></div><strong>紫墨点睛</strong><div>#5B4B7A</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#B5483C"></div><strong>朱砂印泥</strong><div>#B5483C</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#141312"></div><strong>浓墨夜读</strong><div>#141312</div></div>
    </div>
  </div>
  <script src="/api/plugins/sdk/awd-plugin-sdk.js"></script>
</body>
</html>
