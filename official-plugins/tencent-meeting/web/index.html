<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>腾讯会议 · AI WorkDeck</title>
  <link rel="stylesheet" href="panel.css">
  <script src="awd-plugin-sdk.js"></script>
  <script src="panel-l10n.js"></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <main>
    <p id="project-notice" class="notice" role="status"></p>
    <aside id="account-panel" aria-labelledby="connection-title">
      <section class="account-section">
        <h2 id="connection-title" data-i18n="connection">连接</h2>
        <p id="connection-status" role="status"></p>
        <div class="actions"><button id="login" class="primary" data-i18n="login">登录授权</button><button id="logout" data-i18n="logout">退出登录</button><button id="refresh" data-i18n="refresh">检查连接</button></div>
        <div id="logout-confirmation" class="notice" hidden>
          <p data-i18n="logoutWarning">退出将清除本机共享的腾讯会议 CLI 授权，其他使用它的应用也需要重新登录。</p>
          <div class="actions"><button id="confirm-logout" data-i18n="confirmLogout">确认退出本机登录</button><button id="cancel-logout" data-i18n="cancel">取消</button></div>
        </div>
        <div id="authorization" hidden>
          <label for="authorize-url" data-i18n="authHint">复制链接到浏览器完成授权，然后返回这里。</label>
          <div class="copy-row"><input id="authorize-url" readonly autocomplete="off" spellcheck="false"><button id="copy-url" data-i18n="copy">复制链接</button></div>
          <p id="login-wait" class="hint" role="status"></p>
        </div>
      </section>
      <section class="account-section">
        <details id="settings"><summary data-i18n="settings">同步范围与排除词</summary>
          <label for="lookback" data-i18n="lookback">最近多少天</label><input id="lookback" type="number" min="1" max="90" value="30">
          <label for="exclude" data-i18n="exclude">排除会议标题包含的词（每行一个）</label><textarea id="exclude" rows="3" maxlength="4000"></textarea>
          <button id="save-config" data-i18n="save">保存设置</button>
        </details>
      </section>
    </aside>
    <section id="workspace" aria-label="腾讯会议">
      <header class="workspace-toolbar">
        <h1 data-i18n="recordings">会议记录</h1>
        <span id="workspace-status" class="hint" role="status"></span>
        <div class="actions"><button id="workspace-refresh" data-i18n="refreshList"></button><button id="sync" class="primary" data-i18n="sync">同步会议</button></div>
      </header>
      <div class="workspace-body">
        <section id="meeting-browser" aria-label="会议记录">
          <div class="search-box"><label class="sr-only" for="search" data-i18n="search">搜索已同步会议</label><input id="search" type="search" autocomplete="off"><span id="meeting-count" class="hint"></span></div>
          <div class="meeting-scroll"><p id="list-empty" class="empty-state"></p><ul id="meetings" aria-label="会议记录"></ul></div>
        </section>
        <div id="detail-empty" class="empty-state" data-i18n="selectMeeting"></div>
        <section id="detail" hidden aria-labelledby="meeting-title">
          <header class="detail-header">
            <button id="back-to-list" data-i18n="backToList"></button>
            <h2 id="meeting-title"></h2><p id="meeting-meta" class="hint"></p>
            <div class="tabs" role="tablist"><button id="transcript-tab" role="tab" aria-selected="true" aria-controls="transcript" data-i18n="transcript">逐字稿</button><button id="minutes-tab" role="tab" aria-selected="false" aria-controls="minutes" data-i18n="minutes">智能纪要</button><button id="reload-detail" data-i18n="refreshList"></button></div>
          </header>
          <div class="detail-content">
            <div id="completeness" class="notice" role="status" hidden></div>
            <div id="transcript" role="tabpanel" aria-labelledby="transcript-tab" tabindex="0"></div><div id="minutes" role="tabpanel" aria-labelledby="minutes-tab" tabindex="0" hidden></div>
          </div>
          <footer class="actions detail-actions"><button id="draft-minutes" class="primary" data-i18n="draftMinutes">生成会议纪要</button><button id="draft-todos" data-i18n="draftTodos">提取待办</button><button id="export" data-i18n="export">导出到项目</button></footer>
        </section>
      </div>
    </section>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
