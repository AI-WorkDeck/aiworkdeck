<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>包晴天</title><link rel="stylesheet" href="panel.css"><script src="awd-plugin-sdk.js"></script></head>
<body>
<header class="brand-bar"><div class="brand-identity"><img class="brand-avatar" src="avatar.png" alt="包晴天"><div><strong class="brand">包晴天<span class="brand-dot" aria-hidden="true"></span></strong><span class="brand-subtitle">让法律服务相遇</span></div></div><div class="account"><span id="account-status">正在连接工作台…</span><button id="check-account" type="button">检查连接</button><button id="logout" type="button" hidden>退出</button></div></header>
<main>
<section id="connection" class="notice" hidden><h2>连接包晴天账号</h2><p id="connection-message">连接后，可以浏览案源广场，管理平台上的图文笔记和草稿。</p><form id="login-form"><div class="login-fields"><label>区号<select id="country-code"><option value="+86">中国大陆 +86</option><option value="+852">中国香港 +852</option></select></label><label>手机号<input id="mobile" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="11"></label><button id="send-code" type="button">获取验证码</button><label>短信验证码<input id="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label><button id="login" type="submit" class="primary">登录包晴天</button></div><label class="consent"><input id="agreement" type="checkbox">我已阅读并同意包晴天律师用户协议、隐私政策和律师入驻协议，使用手机号连接包晴天律师账号。</label><p class="muted">短信和登录请求由本插件直接发送至包晴天。手机号和验证码仅在本页临时使用。</p><details class="legal-details"><summary>阅读包晴天协议（复制链接到浏览器）</summary><label>律师用户协议<input readonly id="agreement-url" value="https://apk.bqt.com/bqt-package-apk/user_agreement_lawyer.html"></label><button type="button" data-copy="agreement-url">复制用户协议链接</button><label>隐私政策<input readonly id="privacy-url" value="https://apk.bqt.com/bqt-package-apk/privacy_policy_lawyer.html"></label><button type="button" data-copy="privacy-url">复制隐私政策链接</button><label>律师入驻协议<input readonly id="entry-url" value="https://apk.bqt.com/bqt-package-apk/entry_agrement_lawyer.html"></label><button type="button" data-copy="entry-url">复制入驻协议链接</button></details></form></section>
<div class="workspace-head"><nav aria-label="包晴天功能"><button id="nav-cases" type="button" aria-current="page">案源广场</button><button id="nav-notes" type="button">我的笔记</button></nav><button id="new-note" class="primary" type="button" hidden>新建笔记</button></div>
<div id="feedback" role="status" aria-live="polite"></div>
<section aria-labelledby="section-title"><div class="section-heading"><div><h1 id="section-title">案源广场</h1><p id="section-caption" class="muted">了解法律需求，找到合适的合作机会。</p></div><span id="result-count" class="muted"></span></div>
<form id="search-form" class="filters"><label class="search"><span class="sr-only">搜索标题或内容</span><input id="keyword" type="search" placeholder="筛选本页案源标题或内容" maxlength="100"></label><label id="status-filter-label" hidden><span class="sr-only">本页笔记状态</span><select id="status-filter"><option value="">全部笔记</option><option value="draft">草稿</option><option value="published">公开发布</option><option value="private">仅自己可见</option></select></label><button id="search-submit" type="submit">筛选本页</button><button id="reload" type="button">刷新</button></form><p id="filter-scope" class="muted filter-scope">关键词仅筛选当前页案源；可翻页继续查找。</p>
<div class="content-layout"><div class="results"><div id="list" class="item-list" aria-live="polite"></div><div id="empty" class="empty">正在连接包晴天…</div><div class="pagination"><button id="previous" type="button" disabled>上一页</button><span id="page-label">第 1 页</span><button id="next" type="button" disabled>下一页</button></div></div>
<aside id="detail" class="detail" aria-labelledby="detail-title" hidden><div class="detail-heading"><h2 id="detail-title">案源详情</h2><button id="close-detail" type="button" aria-label="关闭详情">关闭</button></div><p id="detail-meta" class="muted"></p><p id="detail-budget" class="budget"></p><div id="detail-content" class="prose"></div></aside>
<section id="editor" class="editor" aria-labelledby="editor-heading" hidden><div class="detail-heading"><h2 id="editor-heading">新建笔记</h2><button id="close-editor" type="button">关闭</button></div><p id="note-state" class="muted">尚未保存</p><label id="business-label" for="note-business" hidden>业务类别</label><select id="note-business" hidden><option value="">请选择业务类别</option></select><fieldset id="media-picker" hidden><legend>笔记媒体</legend><label for="media-type">类型</label><select id="media-type"><option value="IMAGE">图文笔记</option><option value="VIDEO">视频笔记</option></select><label id="media-files-label" for="media-files">图片（1–9 张，每张不超过 10 MiB）</label><input id="media-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><label id="video-cover-label" for="video-cover" hidden>视频封面（独立图片，不超过 10 MiB）</label><input id="video-cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><ul id="media-file-list"></ul><p id="media-validation" class="muted">请选择图片后保存。</p></fieldset><label for="note-title">标题</label><input id="note-title" maxlength="200" placeholder="给这篇笔记起个标题"><label for="note-content">正文</label><textarea id="note-content" rows="14" maxlength="50000" placeholder="写下希望分享的法律知识或服务经验"></textarea><div id="note-images" hidden></div><p class="muted" id="image-hint">新建需上传图片或视频及封面；编辑现有笔记时保留原媒体。</p><label for="note-visibility">发布可见范围</label><select id="note-visibility"><option value="published">公开发布</option><option value="private">仅自己可见</option></select><div class="editor-actions"><button id="save-draft" type="button">保存草稿</button><button id="publish-note" class="primary" type="button">发布笔记</button><button id="delete-note" class="danger" type="button" hidden>删除</button></div><button id="resume-upload" type="button" hidden>继续上传同一篇笔记</button><p id="upload-progress" role="status" aria-live="polite" hidden></p><button id="verify-save" type="button" hidden>刷新本人笔记，核对保存结果</button><p class="muted">保存草稿不会发布。发布前会再次请您确认。</p></section></div></section>
</main>
<div id="confirmation" class="confirm-backdrop" hidden><section class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"><h2 id="confirm-title">请确认</h2><p id="confirm-message"></p><div class="editor-actions"><button id="cancel-confirm" type="button">取消</button><button id="accept-confirm" class="primary" type="button">确认</button></div></section></div>
<script src="model.js"></script><script src="secure.js"></script><script src="panel.js"></script></body></html>
