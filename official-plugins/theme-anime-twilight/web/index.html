<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日漫晨昏 · 逢魔之时</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--awd-font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
      background: var(--awd-bg, #F5F4FA);
      color: var(--awd-text, #1E243B);
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--awd-surface, #FDFCFE);
      border: 1px solid var(--awd-border, #D4CFE6);
      border-radius: 10px;
      padding: 20px;
      box-shadow: var(--awd-shadow-sm, 0 1px 2px rgba(0,0,0,0.06));
    }
    .title { font-size: 20px; font-weight: 600; margin: 10px 0 6px; }
    .subtitle { color: var(--awd-text-2, #545B78); font-size: 13px; margin-bottom: 16px; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .swatch { border: 1px solid var(--awd-border, #D4CFE6); border-radius: 8px; padding: 12px; font-size: 12px; }
    .swatch-dot { width: 28px; height: 28px; border-radius: 50%; margin-bottom: 8px; border: 1px solid rgba(128,128,128,0.25); }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: var(--awd-accent-soft, #EAE7FA); color: var(--awd-accent-text, #4C4194);
      font-size: 12px; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">UI 皮肤插件 · Skin 03</span>
    <h1 class="title">日漫晨昏 · 逢魔之时</h1>
    <p class="subtitle">新海诚式群青星空与暮色珊瑚霞光交汇，薰衣草紫星芒点亮赛璐珞通透玻璃界面。</p>
    <div class="swatches">
      <div class="swatch"><div class="swatch-dot" style="background:#F5F4FA"></div><strong>朝霞晴空</strong><div>#F5F4FA</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#53489E"></div><strong>星芒紫蓝</strong><div>#53489E</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#E07A5F"></div><strong>暮色珊瑚</strong><div>#E07A5F</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#9D8DF2"></div><strong>薰衣草星</strong><div>#9D8DF2</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#14192B"></div><strong>逢魔群青</strong><div>#14192B</div></div>
    </div>
  </div>
  <script src="/api/plugins/sdk/awd-plugin-sdk.js"></script>
</body>
</html>
