<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="plugin.name"></title>
  <style>
    :root {
      color-scheme: light dark;
      --skin-bg: #F5F4FA;
      --skin-surface: #FDFCFE;
      --skin-text: #1E243B;
      --skin-text-2: #545B78;
      --skin-border: #D4CFE6;
      --skin-accent-soft: #EAE7FA;
      --skin-accent-text: #4C4194;
    }
    html[data-theme='dark'] {
      --skin-bg: #14192B;
      --skin-surface: #1C2238;
      --skin-text: #EEF0FA;
      --skin-text-2: #ADB4D1;
      --skin-border: #343F61;
      --skin-accent-soft: rgba(157, 141, 242, 0.16);
      --skin-accent-text: #B5AAFA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--awd-font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
      background: transparent;
      color: var(--skin-text);
      padding: 2px;
      line-height: 1.5;
      overflow: hidden;
    }
    .card {
      background: var(--skin-surface);
      border: 1px solid var(--skin-border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .subtitle {
      color: var(--skin-text-2);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .swatch {
      background: var(--skin-bg);
      border: 1px solid var(--skin-border);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
    }
    .swatch-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-bottom: 6px;
      border: 1px solid rgba(128,128,128,0.28);
    }
    .swatch-hex {
      color: var(--skin-text-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
    }
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--skin-accent-soft);
      color: var(--skin-accent-text);
      font-size: 11px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head-row">
      <h1 class="title" data-i18n="plugin.name"></h1>
      <span class="badge" data-i18n="gallery.badge"></span>
    </div>
    <p class="subtitle" data-i18n="plugin.desc"></p>
    <div class="swatches">
      <div class="swatch"><div class="swatch-dot" style="background:#F5F4FA"></div><strong data-i18n="gallery.swatch1"></strong><div class="swatch-hex">#F5F4FA</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#53489E"></div><strong data-i18n="gallery.swatch2"></strong><div class="swatch-hex">#53489E</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#E07A5F"></div><strong data-i18n="gallery.swatch3"></strong><div class="swatch-hex">#E07A5F</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#9D8DF2"></div><strong data-i18n="gallery.swatch4"></strong><div class="swatch-hex">#9D8DF2</div></div>
      <div class="swatch"><div class="swatch-dot" style="background:#14192B"></div><strong data-i18n="gallery.swatch5"></strong><div class="swatch-hex">#14192B</div></div>
    </div>
  </div>
  <script src="awd-plugin-sdk.js"></script>
  <script src="gallery-l10n.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
