# 桌面/单机模式 profile（Epic #18 T1）
# 激活方式：java -jar backend.jar --spring.profiles.active=desktop
# （或环境变量 SPRING_PROFILES_ACTIVE=desktop）
#
# 设计目标：零外部依赖启动——不需要 PostgreSQL，数据落在用户主目录的 H2 文件库。
# 向量检索由 PgVectorConfig 自动降级为内存存储（PG 不可达时的既有回退路径）。

# 单机模式只服务本机 Electron 壳（渲染层固定连 localhost:9696）。
# 这里显式钉死回环：本 profile 同时开了 allow-all-users，一旦监听到 0.0.0.0，
# 同一网段（办公 wifi、酒店、客户现场）的任何人都能注册账号并直接拿到管理员权限。
server:
  address: 127.0.0.1

spring:
  datasource:
    driver-class-name: org.h2.Driver
    # H2 文件库：~/.aiworkdeck/local.mv.db
    # MODE=PostgreSQL：兼容实体里的 PG 风格列定义（如 jsonb）
    # NON_KEYWORDS=VALUE：system_setting.value 列与 H2 保留字冲突的豁免
    # AUTO_SERVER=TRUE：进程重复启动时附着到已有实例而非文件锁报错
    url: jdbc:h2:file:${user.home}/.aiworkdeck/local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

# 桌面/单机：所有登录用户都是管理员（系统管理/向导重置对全员开放）。
# 云端多人部署不设此项（默认 false，仅 admin 账号）。
security:
  # 单机免登模式：所有请求一律解析为「本机用户」，不再需要登录。
  # 安全前提是上方 server.address 钉死回环——LocalModeLoopbackGuard 在启动时强校验，
  # local-mode=true 且监听地址非 127.0.0.1/localhost 时直接拒绝启动（2026-08 审计不变式）。
  local-mode: true
  admin:
    allow-all-users: true
    # 单机本地默认口令，与向导页提示一致。云端 profile 不设此项：
    # DataInitializer 届时随机生成一次性强口令，避免服务器出现众所周知的默认口令。
    initial-password: "123"
  # 官方发布的桌面版：解锁门只接受账户凭据（手机号/邮箱登录，或手工粘 awdk_ Key），
  # 试用码这条离线解锁路关闭。**这是默认值不是 DRM**——商业版、私有部署、自行 fork
  # 把 enabled 改回 true 即完全恢复原行为，刻意不做防篡改。
  #
  # 之所以关这一项而不是翻 security.local-mode（立项书原方案）：那一位是「这是单机桌面版」
  # 的判别位，不是「要不要登录」的开关。翻它会连带关掉解锁门本身、剪贴板/缓存区免费额度、
  # 平台 AI 通道、本机设备令牌与切站能力，并让 /api/account/login 自己把自己锁死。
  # 完整论证见 docs/superpowers/specs/2026-08-18-desktop-account-required-design.md §1。
  license:
    trial-code:
      enabled: false
      # 存量用试用码解锁的机器的过渡期硬期限：期内照常可用并倒计时提醒，到期才落回未解锁。
      # 与官网手机号补绑同一天（docs/.../2026-08-17-phone-login-design.md §5），
      # 让老用户只被打扰一次。留空或写错格式一律按「已到期」处理（安全侧默认）。
      legacy-grace-until: "2026-09-30"
  # IDE 化「打开本机文件夹作为项目」。单机版的「服务器」就是用户自己的电脑，读自己的磁盘正是本意；
  # 共享部署里同一个接口等于让任意租户挂载任意绝对路径当项目根，故云端 profile 不设此项（默认 false）。
  local-folder-projects:
    enabled: true
