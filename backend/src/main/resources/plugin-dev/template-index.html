<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>__PLUGIN_NAME__</title>
  <!-- AWD Plugin UI v3.0（宋韵精工）：awd-plugin-sdk.js 会自动注入 .awd-plugin-stage /
       .awd-plugin-header / .awd-plugin-grid / .awd-card / .awd-btn / .awd-safe-progress 等标准类，
       并自动把宿主 --awd-* 主题令牌同步到本页，零配置支持亮/暗双模与窄栏自适应。 -->
  <style>
    body { margin: 0; background: var(--awd-bg, #F6F5F0); color: var(--awd-text, #2B2A26); }
    #out { margin-top: 10px; white-space: pre-wrap; color: var(--awd-text-2, #6B675C); font-family: var(--awd-font-mono, monospace); font-size: 12px; }
  </style>
</head>
<body>
  <main class="awd-plugin-stage">
    <header class="awd-plugin-header">
      <div>
        <div class="awd-eyebrow">AWD PLUGIN UI V3.0</div>
        <h1 class="awd-title">__PLUGIN_NAME__</h1>
        <p class="awd-subtitle">这是插件骨架。修改 web/ 下的源码并重新安装即可看到变化。</p>
      </div>
      <div class="awd-header-actions">
        <button id="demo" class="awd-btn awd-btn-primary">读取项目文件列表</button>
      </div>
    </header>
    <div id="progress" hidden></div>
    <section class="awd-card">
      <div class="awd-card-header">
        <h2 class="awd-card-title">运行状态与输出</h2>
      </div>
      <div id="out">正在等待宿主握手…</div>
    </section>
  </main>

  <!-- SDK 必须用同步 script 且排在业务脚本之前：宿主在 iframe load 后立刻握手 -->
  <script src="./awd-plugin-sdk.js"></script>
  <script>
    awd.ready().then(function (ctx) {
      document.getElementById('out').textContent = '已连接宿主，项目 ID: ' + ctx.projectId;
    });
    document.getElementById('demo').addEventListener('click', function () {
      awd.files.list().then(function (files) {
        document.getElementById('out').textContent =
          files.map(function (f) { return f.path; }).join('\n') || '(项目暂无文件)';
      }).catch(function (e) {
        document.getElementById('out').textContent = '调用失败: ' + e.code + ' ' + e.message;
      });
    });
  </script>
</body>
</html>
