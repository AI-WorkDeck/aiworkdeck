<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>__PLUGIN_NAME__</title>
  <!-- 颜色一律 var(--awd-*, 兜底值)：宿主握手后会把当前主题的 --awd-* 令牌注入
       本 iframe（名单见宿主 utils/appTheme.js 的 THEME_TOKEN_NAMES），插件就自动跟随
       亮/暗主题；兜底值取自 design/tokens/awd-palette.json 的浅色角色，供老宿主使用。 -->
  <style>
    body { margin: 0; padding: 12px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: var(--awd-text, #2B2A26); background: var(--awd-surface, #FCFBF7); }
    h1 { font-size: 14px; margin: 0 0 8px; }
    button { font-size: 12px; padding: 4px 10px; border: 1px solid var(--awd-border, #DDD8CA); border-radius: 4px; background: var(--awd-surface-2, #E9E6DC); cursor: pointer; }
    button:hover { background: var(--awd-surface-3, #DFDBCE); }
    #out { margin-top: 10px; white-space: pre-wrap; color: var(--awd-text-2, #6B675C); }
  </style>
</head>
<body>
  <h1>__PLUGIN_NAME__</h1>
  <p>这是插件骨架。修改 web/ 下的源码并重新安装即可看到变化。</p>
  <button id="demo">读取项目文件列表</button>
  <div id="out"></div>

  <!-- SDK 必须用同步 script 且排在业务脚本之前：宿主在 iframe load 后立刻握手 -->
  <script src="./awd-plugin-sdk.js"></script>
  <script>
    awd.ready().then(function (ctx) {
      document.getElementById('out').textContent = '已连接宿主，项目 ID: ' + ctx.projectId;
    });
    document.getElementById('demo').addEventListener('click', function () {
      awd.files.list().then(function (files) {
        document.getElementById('out').textContent =
          files.map(function (f) { return f.path; }).join('\n') || '(项目暂无文件)';
      }).catch(function (e) {
        document.getElementById('out').textContent = '调用失败: ' + e.code + ' ' + e.message;
      });
    });
  </script>
</body>
</html>
