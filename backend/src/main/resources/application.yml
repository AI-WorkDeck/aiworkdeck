server:
  port: 9696
  # 默认只监听回环：桌面版所有登录用户都是管理员、注册又是开放的，绑 0.0.0.0
  # 等于把管理员后台（明文 API Key、AI baseUrl / 系统提示词）交给同一网段的任何人。
  # 与 deploy/web 的部署基线一致（团队版由 nginx 反代 127.0.0.1:9696）。
  # 确需对外监听的部署用环境变量 SERVER_ADDRESS=0.0.0.0 覆盖。
  address: 127.0.0.1

spring:
  application:
    name: checkba-backend
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    # PostgreSQL with pgvector
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/checkba
    username: checkba
    password: ${DB_PASSWORD:checkba123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        types:
          print:
            banner: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20GB
      max-request-size: 20GB
      file-size-threshold: 1GB

# 外部服务配置
external:
  qichacha:
    base-url: https://api.qichacha.com
    key: ${QICHACHA_KEY:}
    secret: ${QICHACHA_SECRET:}
  tushare:
    base-url: http://api.tushare.pro
    token: ${TUSHARE_TOKEN:}
  # PKULaw Configuration
  pkulaw:
    token: ${PKULAW_TOKEN:}
  # ElevenLabs TTS 配置
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    base-url: https://api.elevenlabs.io/v1
    model-id: eleven_multilingual_v2
    default-voice-id: JBFqnCBsd6RMkjVDRZzb
  # 语音合成提供方：elevenlabs（云端，默认）或 local（桌面捆绑的 Kokoro 本地服务）。
  # 桌面打包态由 Electron 注入 EXTERNAL_TTS_PROVIDER=local + 动态端口的 local-base-url
  tts:
    provider: ${EXTERNAL_TTS_PROVIDER:elevenlabs}
    local-base-url: ${EXTERNAL_TTS_LOCAL_BASE_URL:}
  # PPTX 生成服务配置（banana-slides Docker 容器）
  pptx-service:
    # 服务地址（Docker 容器映射端口）
    base-url: http://localhost:5001
    # 请求超时时间（秒）- 生成 PPT 可能需要较长时间
    timeout: 120

# MCP 服务器列表（配置驱动，可任意增删；对应 McpProperties）
# transport 目前仅支持 streamable-http（JSON-RPC over HTTP POST）
# token-setting-key：系统设置里的 token 覆盖键，后台管理界面可在线修改
mcp:
  servers:
    - name: pkulaw-semantic
      url: https://apim-gateway.pkulaw.com/mcp-law-search-service
      token: ${PKULAW_TOKEN:}
      token-setting-key: external.pkulaw.token
      timeout-seconds: 60
      enabled: true
    - name: pkulaw-keyword
      url: https://apim-gateway.pkulaw.com/mcp-law
      token: ${PKULAW_TOKEN:}
      token-setting-key: external.pkulaw.token
      timeout-seconds: 60
      enabled: true
    - name: pkulaw-recognition
      url: https://apim-gateway.pkulaw.com/law_recognition
      token: ${PKULAW_TOKEN:}
      token-setting-key: external.pkulaw.token
      timeout-seconds: 60
      enabled: true

# 登录短信验证（阿里云 dysmsapi；仅 server 模式生效，local-mode 免登无登录环节）。
# AK/SK 一律环境变量注入（与 OSS_ACCESS_KEY_* 同一模式），绝不写进任何入库文件。
# 官方托管的插件云后端：SMS_AUTH_ENABLED=true + RAM 子用户密钥（仅 AliyunDysmsFullAccess）。
sms:
  enabled: ${SMS_AUTH_ENABLED:false}
  access-key-id: ${SMS_ACCESS_KEY_ID:}
  access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
  sign-name: ${SMS_SIGN_NAME:京微资易科技}
  template-code: ${SMS_TEMPLATE_CODE:SMS_483655011}
  # 境外号码走 Twilio（大陆号仍走上面的阿里云通道，两条独立开关）。
  # 各国 Sender ID / 美国 10DLC / 印度 DLT 等合规在 Twilio 控制台的 Messaging Service
  # 里配置，代码只认 messaging-service-sid——加国家不需要改代码发版。
  intl:
    enabled: ${SMS_INTL_ENABLED:false}
    # 账号标识（AC 开头），出现在 API 路径里
    account-sid: ${TWILIO_ACCOUNT_SID:}
    # API Key（SK 开头，推荐）：可单独吊销，泄露时不必换整个账号的 Auth Token。
    # 留空则用 account-sid 直接做 Basic 用户名（账号 Auth Token 认证）
    api-key-sid: ${TWILIO_API_KEY_SID:}
    # API Key 的 secret，或账号 Auth Token（取决于上一项是否配置）
    auth-token: ${TWILIO_AUTH_TOKEN:}
    messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
    template: ${TWILIO_SMS_TEMPLATE:Your AI Workdeck verification code is {code}. It expires in 5 minutes.}

# 邮件发信（按收件域名分流的两条 SMTP 通道，见 com.checkba.service.mail）。
# 密码一律环境变量注入，与 SMS_ACCESS_KEY_* 同一模式，绝不写进任何入库文件。
# 刻意不用 Spring Boot 的 spring.mail.*：那套只装配得出一个 JavaMailSender，
# 而国内/国外必须并存——两条各自独立开关，只配一条的部署照常工作。
mail:
  # 发件人显示名，两条通道共用
  from-name: ${MAIL_FROM_NAME:AI Workdeck}
  # 邮箱免密登录（输邮箱→收码→直接登录，不过密码）。**独立开关且默认关**：
  # 它是一条新的匿名登录入口，攻击面与密码登录不同——邮箱被盗即账号被盗。
  # 关闭时邮箱仍可作为登录二次验证使用（那条不需要这个开关）。
  passwordless-login-enabled: ${MAIL_PASSWORDLESS_LOGIN_ENABLED:false}
  # 国内主流邮箱（QQ/163/126/139…）走这条：阿里云邮件推送，发信域名 dm.aiworkdeck.com。
  # 用户名就是发信地址本身；密码是控制台「发信地址 → 设置SMTP密码」设的那个，不是 AccessKey。
  domestic:
    enabled: ${MAIL_DOMESTIC_ENABLED:false}
    host: ${MAIL_DOMESTIC_HOST:smtpdm.aliyun.com}
    port: ${MAIL_DOMESTIC_PORT:465}
    username: ${MAIL_DOMESTIC_USERNAME:}
    password: ${MAIL_DOMESTIC_PASSWORD:}
    from: ${MAIL_DOMESTIC_FROM:}
  # 其余邮箱（Gmail/Outlook/企业自有域名…）走这条：Resend，发信域名 send.aiworkdeck.com。
  # 用户名固定字面量 resend，密码填 API key（re_ 开头），不是账号邮箱。
  global:
    enabled: ${MAIL_GLOBAL_ENABLED:false}
    host: ${MAIL_GLOBAL_HOST:smtp.resend.com}
    port: ${MAIL_GLOBAL_PORT:465}
    username: ${MAIL_GLOBAL_USERNAME:resend}
    password: ${MAIL_GLOBAL_PASSWORD:}
    from: ${MAIL_GLOBAL_FROM:}

# AI 大模型配置（供应商可切换）
ai:
  # 官网账户服务地址（解锁门在线校验、账户连接、平台 AI 通道密钥）。
  # 必须是 https：这条通道上跑的是明文 awdk_ 账户 Key，配成 http 会被启动期直接拒绝。
  #
  # 双主站（设计见 docs/superpowers/specs/2026-08-08-dual-site-architecture.md）：
  # local-mode 下这个值由 SiteEnvironmentPostProcessor 按 ~/.aiworkdeck/site.json 选中的站点
  # 在启动期覆盖；下面这一行是 site.json 缺失时的兜底，与 sites.cn.base-url 逐字相同，
  # 所以存量安装的行为零变化。环境变量 AI_ACCOUNT_BASE_URL 优先级更高（本地联调用）。
  account:
    base-url: https://www.aiworkdeck.com
    # site.json 缺失时的站点
    default-site: cn
    # 站点表。分的是商业与合规（币种、支付通道、发票、适用法、备案、默认语言、数据落点），
    # **不是模型可用性**——桌面端所有 OpenRouter 请求从用户本机直连 openrouter.ai，
    # 能不能用某个模型由出口 IP 决定，站点无从干预，别在这里加模型过滤。
    sites:
      cn:
        enabled: true
        display-name: AI Workdeck 国内站
        base-url: https://www.aiworkdeck.com
        registry-base-url: https://www.aiworkdeck.com/api/registry
        telemetry-ingest-url: https://www.aiworkdeck.com/api/telemetry
        account-page-url: https://www.aiworkdeck.com/zh/account
      intl:
        # 国际站上线前保持 false：站点选择器只在可选站点 >= 2 时出现，
        # 置 false 时用户看不到任何与站点有关的界面变化
        enabled: false
        display-name: AI Workdeck International
        base-url: https://www.workdeck.ai
        registry-base-url: https://www.workdeck.ai/api/registry
        telemetry-ingest-url: https://www.workdeck.ai/api/telemetry
        account-page-url: https://www.workdeck.ai/en/account
  # 辅助模型：起标题 / 上下文摘要 / 记忆抽取 / memory_search / 文件自动打标签。
  # 这些调用用户看不见但每轮都在跑，单列一个便宜模型是省钱的主要来源；
  # 默认取白名单里最便宜且支持 tools 的一条（0.03/0.13 美元每 1M token，1M 上下文）。
  # 运行时可被 system_setting 的 ai.auxModel 覆盖；非白名单模型会被工厂直接拒绝（不静默回落）。
  aux-model: qwen/qwen3.7-flash
  model:
    # 当前启用的提供商（三档）：awd-cloud（平台通道）/ open-router（自备 Key）/ ollama（本地，实验档）
    provider: open-router
    ollama:
      # 与当前本地 Ollama 配置保持一致，方便一键切换回本地模型
      base-url: http://localhost:11434
      model-name: qwen3-vl:8b
      temperature: 0.7
      timeout: 300s
    open-router:
      # OpenRouter API Key (必填)
      api-key: ${OPENROUTER_API_KEY:}
      base-url: https://openrouter.ai/api/v1
      default-model: deepseek/deepseek-v4-flash
      # langchain4j 0.36 把这一个值同时灌进 OkHttp 的 callTimeout（整通调用墙钟上限，
      # 含完整流式响应体）。120s 会把仍在稳定吐 token 的长轮次拦腰掐断（跑一半断的头号根因），
      # 调大到 600s；"流真停了"的场景由 AgentStreamHandler 的无活动看门狗（180s）兜底。
      timeout: 600s
  # LLM 故障转移链（对应 AiFailoverProperties）。
  # 触发条件：重试预算耗尽仍是限流/瞬时错误，或模型下线（404「No endpoints found」，PR#144 的坑）。
  # 只换模型不换计费通道——通道由 ai.activeProvider 决定，平台通道 AWD_CLOUD 永远拿平台密钥。
  # 候选必须在 AllowedModels 白名单内，否则会被工厂静默回落默认模型，等于没切。
  failover:
    enabled: true
    models:
      # 区域无关的常青模型（国内外均实测可用），与默认模型撞车时会自动跳过。
      # 必须是 AllowedModels.Region.GLOBAL——境内用户的兜底路径不能是境内被 403 的国际模型，
      # 由 AiFailoverPropertiesBindingTest 守
      - deepseek/deepseek-v4-flash
      - qwen/qwen3.7-flash
  # AI 上下文与压缩配置（对应 AiContextProperties，以下均为默认值，可按需覆盖）
  context:
    # 上下文总 token 预算
    max-context-tokens: 100000
    # 各项 token 预留
    system-prompt-reserve: 8000
    memory-reserve: 5000
    response-reserve: 8000
    # token 估算系数：每个 token 约折合多少字符
    chars-per-token: 2.0
    # 按模型覆盖 token 总预算（key 支持子串匹配模型标识），示例：
    # model-token-budgets:
    #   "[gemini]": 500000
    #   "[qwen3-vl]": 30000
    compression:
      keep-recent-with-summary: 10
      min-messages-for-summarize: 6
      keep-recent-on-summarize: 4
      keep-recent-aggressive: 2
      max-history-messages: 30
      tool-output-max-chars: 2000
      tool-output-target-chars: 1500
    # 运行中自动 compaction：runLoop 每轮 generate 前估算 token，超阈值把中段折叠成一条摘要
    compaction:
      enabled: true
      trigger-ratio: 0.8
      keep-recent: 8
      min-middle-messages: 4
      digest-max-chars: 4000
      per-message-chars: 240
    files:
      max-file-size-bytes: 10485760
      max-files-per-context: 10
      max-chars-per-file: 50000
      folder-file-max-chars: 20000
      chat-context-max-chars: 6000
      chat-folder-context-max-chars: 50000
      chat-selection-max-chars: 1500
    # 支持 OCR 的文件扩展名
    ocr-extensions: [jpg, jpeg, png, gif, bmp, webp, pdf]
  # 子 Agent（dispatch_subtask 委派子任务）配置（对应 SubAgentProperties，以下均为默认值）
  subagent:
    # 单个子任务的循环轮数上限
    max-rounds: 6
    # 同时运行的子任务数上限（专用线程池大小）
    max-parallel: 3
    # 单个子任务超时（秒）。必须大于 ai.model.open-router.timeout（600s）：
    # 小于它的话等待方先放弃，而 cancel(true) 打不断阻塞中的 HTTP 读，
    # 子 Agent 会照样烧完 token 而结果被丢弃。
    timeout-seconds: 630
    # 子 Agent 消息栈 token 预算（估算）。× chars-per-token = 120000 字符，
    # 要能装下两个满额（50000 字符）文件；30000 时读一个文件就吃掉 5/6 预算。
    token-budget: 60000
    # token 估算系数（与 ai.context.chars-per-token 口径一致）
    chars-per-token: 2.0
    # 子 Agent 模型 ID。解析链：system_setting 的 ai.subagentModel → 本项 →
    # 辅助模型（ai.auxModel / yml 的 ai.aux-model）。留空即用便宜的辅助模型，
    # 不再继承主会话所选模型（子任务多是读文件/摘要这类活，没必要用贵模型）。
    model: ""
  # 插件体系配置（规范见 docs/PLUGIN_SPEC.md，在线分发见 docs/PLUGIN_DISTRIBUTION.md）
  plugins:
    # 插件扫描目录（相对服务端工作目录；打包桌面版落在 ~/.aiworkdeck/plugins/）
    dir: plugins
    # 启停名单内存缓存 TTL（毫秒）
    disabled-cache-ttl-ms: 5000
    # 在线插件广场注册表地址
    registry-url: https://www.aiworkdeck.com/api/registry/plugins
    # 平台签名公钥（Ed25519 SPKI PEM）。安装在线插件时用它验签，
    # 留空则拒绝一切在线安装。私钥仅存在于官网服务器的 AWD_PLUGIN_SIGNING_KEY。
    # 换密钥需同步更新此处并随版本发布，见 docs/PLUGIN_DISTRIBUTION.md §5。
    #
    # 公钥是公开信息，硬编码在客户端是标准做法（等同 CA 根证书内置）：
    # 客户端必须在离线、未登录、注册表被劫持的情况下也能独立判断签名真伪，
    # 所以它不能从网络获取。密钥对生成于 2026-07-27。
    registry-public-key: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEAjAbnyl44SiQF/CTyn59/uHAXCeRTEI0h0Bn5HEv7T4Y=
      -----END PUBLIC KEY-----

  # Skill 体系配置（对应 SkillProperties，规范见 docs/SKILL_SPEC.md）
  skills:
    # skill 扫描目录（相对服务端工作目录，做法同 ai.plugins.dir）
    dir: skills
    # 基础工具集：Skill 命中后本轮 LLM 可见工具 = allowed_tools ∪ base-tools
    base-tools: [read_document, list_files, query_memory]
    # 启停名单内存缓存 TTL（毫秒）
    disabled-cache-ttl-ms: 5000
    # 在线 Skill 广场注册表地址（官网公共注册表，见 SkillMarketService）
    registry-url: https://www.aiworkdeck.com/api/registry/skills

# 匿名使用统计（设计见 docs/ANALYTICS_TELEMETRY_DESIGN.md）：
# 本地账本永远记录；出本机由 system_setting 的 telemetry.rollup.enabled（默认开）/
# telemetry.events.enabled（默认关）控制，设置页可随时关闭
telemetry:
  # 官网 ingest 基址（POST {base}/rollup 与 {base}/events）
  ingest-url: https://www.aiworkdeck.com/api/telemetry
  # 应用版本（桌面壳经 AWD_APP_VERSION 注入；单一来源 desktop/package.json）
  app-version: ${AWD_APP_VERSION:dev}
  # 事项分类兜底用的平价模型
  classifier-model: deepseek/deepseek-v4-flash

# 用户反馈（桌面端右下角浮窗）。设计见 docs/FEEDBACK_OPTIMIZER_DESIGN.md
feedback:
  # 附在反馈里的后端日志尾巴取自这些文件（逗号分隔，取第一个存在且非空的）。
  # 留空 = 用默认：~/.aiworkdeck/logs/backend.log（打包态）与 app.log（dev 态）
  log-files: ""
  # 上传到云端收件箱：本机先落库，再异步补传（断网/关机不丢，节奏同 telemetry）。
  # 反馈是用户主动提交给我们的内容，默认开；不想外发把 enabled 置 false 即可，
  # 本机后台仍然看得到自己报过什么。
  upload:
    enabled: ${FEEDBACK_UPLOAD_ENABLED:true}
    url: ${FEEDBACK_UPLOAD_URL:https://addin.aiworkdeck.com/api/feedback/ingest}
  # 云端收件箱（只在承载收件箱的那个实例上开；桌面版恒为 false）
  ingest:
    enabled: ${FEEDBACK_INGEST_ENABLED:false}
    per-install-daily: 20
    global-daily: 2000
    max-attachment-bytes: 5242880
    max-attachments: 4
  # 优化者取件/回执的共享密钥（收件箱侧）。**留空 = 取件与回执整组 403**，
  # 不留「未配置即放行」的逃生门。与优化者侧 optimizer.remote.token 必须一致。
  optimizer-token: ${FEEDBACK_OPTIMIZER_TOKEN:}
  # 语音转写（可选）。产品没捆绑离线 ASR，这里只留一个 OpenAI 兼容接口位：
  # 配了就转写，没配语音仍会作为附件留存，且分诊会强制走「转人」出口。
  transcription:
    enabled: ${FEEDBACK_ASR_ENABLED:false}
    base-url: ${FEEDBACK_ASR_BASE_URL:}
    api-key: ${FEEDBACK_ASR_KEY:}
    model: ${FEEDBACK_ASR_MODEL:whisper-1}

# 优化者（Optimizer Agent）：按天读新反馈，确认是 bug 就开 PR，其余发邮件问人。
# **默认整体关闭**——这是维护者侧能力（要仓库工作副本 + gh 登录 + 编码 Agent CLI +
# 收件箱），装在用户机器上的桌面版绝不该自己跑起来开 PR。
optimizer:
  enabled: ${OPTIMIZER_ENABLED:false}
  # Spring cron（6 段）。默认每天 09:00 一轮；改成每周一次就写 "0 0 9 * * MON"
  cron: ${OPTIMIZER_CRON:0 0 9 * * *}
  batch-size: 5
  max-attempts: 3
  # 演练：照常分诊写库，但不开 PR、不发邮件、不改状态
  dry-run: ${OPTIMIZER_DRY_RUN:false}
  # 分诊模型；留空继承 ChatModelFactory 的默认模型
  model: ${OPTIMIZER_MODEL:}
  # 判成 bug 且置信度不低于此值才去改代码，否则降级发邮件问人
  min-confidence: 0.7
  # 反馈来源：local（读本进程的库）| remote（读云端收件箱）。
  # 生产形态是 remote：收件箱在云上收各安装的反馈，优化者跑在维护者自己的机器上——
  # 一个能写代码、能推分支的 Agent 不该和生产站同机，而输入正是用户可控的文本。
  source: ${OPTIMIZER_SOURCE:local}
  remote:
    base-url: ${OPTIMIZER_REMOTE_URL:}
    token: ${OPTIMIZER_REMOTE_TOKEN:}
  repo:
    # 仓库工作副本的绝对路径（维护者机器上的一份 clone）
    path: ${OPTIMIZER_REPO_PATH:}
    base-branch: ${OPTIMIZER_BASE_BRANCH:master}
    remote: origin
    branch-prefix: optimizer/feedback-
  agent:
    # 编码 Agent 命令行；{prompt} 换成任务书正文，{promptFile} 换成任务书文件路径
    command: [ "claude", "-p", "{prompt}", "--permission-mode", "acceptEdits" ]
    timeout-seconds: 1800
  # 通知出口：auto（默认，有邮件用邮件、没有就开 GitHub Issue）| mail | issue | both。
  # 之所以默认自己降级：邮件要维护者亲自去邮箱后台生成授权码才能用，而开 Issue
  # 复用优化者本来就有的 gh 登录，零新增凭据——「反馈没人管」不该取决于有没有腾出时间配 SMTP。
  notify:
    channel: ${OPTIMIZER_NOTIFY_CHANNEL:auto}
    # 仓库里没建过的标签会被自动去掉重试，不会因此让整条出口不可用
    issue-labels: [ user-feedback ]
  mail:
    enabled: true
    # 收件人（维护者），逗号分隔可多个。发信通道本身是上面的 mail.domestic/global，
    # 一条都没配时这条出口会报「不可用」并由 notify.channel=auto 落到开 Issue。
    # 发件人由通道决定，此处不设——两条通道发信域名不同，硬写 from 会让 SPF 判失败。
    to: ${OPTIMIZER_MAIL_TO:}
    subject-prefix: "[AI Workdeck 优化者]"

# 文件存储配置
storage:
  # 存储类型：local（本地文件系统）或 oss（对象存储）
  type: local
  # 本地存储配置
  local:
    # 存储根目录（相对于项目根目录或绝对路径）
    root-path: data
    # 模板文件路径（用于新建文档的初始内容）
    template-path: docs/template.docx
  # 对象存储配置（当 type=oss 时生效）
  oss:
    # 对象存储提供商：aliyun（阿里云OSS）、aws（AWS S3）、minio（MinIO）
    provider: aliyun
    # 访问密钥ID
    access-key-id: YOUR_ACCESS_KEY_ID
    # 访问密钥Secret
    access-key-secret: YOUR_ACCESS_KEY_SECRET
    # 存储桶名称
    bucket-name: your-bucket-name
    # 存储桶所在区域（例如：oss-cn-hangzhou、us-east-1）
    region: oss-cn-hangzhou
    # 自定义端点（可选，用于MinIO或私有部署）
    endpoint:
    # 文件存储路径前缀（可选，例如：wps-files/）
    path-prefix: wps-files/
    # 是否使用HTTPS
    use-https: true
    # CDN域名（可选，用于加速访问）
    cdn-domain:

security:
  # conversationId 服务端签发强制开关（公网多租户/官方云置 true）：
  # 开启后（且非 local-mode），尚无消息的会话必须先经 POST /api/agent/conversations 签发，
  # 客户端自造的 conv-<毫秒> ID 会被拒绝；已有消息的会话仍按 DB 归属判定。
  # 默认 false：桌面单机与既有前端自造 ID 流程行为完全不变。
  conversation-issuance-required: false
  # per-user 平台 AI 通道密钥的落库加密密钥（AES-256-GCM，密钥 = SHA-256(本值)）。
  # 开启账户桥接（security.awdk-login-enabled=true，即官方托管的插件云后端）时**必配**，
  # 缺失直接拒绝启动——明文降级属于潜伏逃生门，不留。
  # local-mode 与未开桥接的团队服务器不受影响：它们走机器级密钥文件，不碰这条路。
  platform-key-secret: ${AWD_PLATFORM_KEY_SECRET:}

# LangChain4j Ollama Configuration
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: qwen3-vl:8b
      temperature: 0.7
      timeout: 300s
    embedding-model:
      base-url: http://localhost:11434
      model-name: nomic-embed-text
      timeout: 300s
