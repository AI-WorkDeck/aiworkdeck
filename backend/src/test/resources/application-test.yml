spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;IGNORE_UNKNOWN_SETTINGS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: always
    continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        types:
          print:
            banner: false
