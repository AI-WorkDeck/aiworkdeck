# 法律意见书实质审查/修订；确定性本地路由，不调用模型做预选（dev-board#1092）。
id: legal-opinion-review
name: 法律意见书审查
name_en: Legal Opinion Review
description: 根据相关材料核对法律意见书中的事实、事实时点和结论，保留证据缺口并以修订和批注落实；尊重用户指定的段落范围，不自动扩成合同条款审查。
languages: [zh-CN, en-US]
triggers: [法律意见书, 法律意見書]
triggers_en: [legal opinion]
prompt: prompt.md
tool_policy: restrict
allowed_tools:
