# 股东大会核查 Skill（打包格式见 docs/SKILL_SPEC.md）
id: shareholder-meeting-verification
name: 股东大会核查
description: 上市公司/挂牌公司股东会法律见证：对照股东大会通知、董事会决议公告与投票结果做逐字段交叉核对与表决复算，撰写（或按本所初稿填充）法律意见书，并生成可溯源的交叉核对底稿表。

# 法律事项类别（匿名统计用，枚举见 MatterCategory）
category: 资本市场证券

# 触发条件：用户输入包含任一关键词即命中（面板 kick-off prompt 以「股东大会核查」开头）
triggers:
  - 股东大会核查
  - 股东会核查
  - 股东大会见证
  - 股东会见证
  - 见证法律意见书

# prompt 模板文件名（相对本目录）
prompt: prompt.md

# 工具白名单：命中后本轮 LLM 可见工具 = allowed_tools ∪ 基础工具集（ai.skills.base-tools）
# 基础工具集只有三个（read_document / list_files / query_memory，见 application.yml 的 ai.skills.base-tools），
# 所以凡是本 skill 要用的工具都必须在这里逐个列出——漏了就是「模型看不见 = 不会调用」。
# dispatch_subtask 曾经漏列：本 skill 是 system_prompt.md 第 6.5 节明确要委派的长程任务
#（逐份文件抽取字段本身就是「会产生大量中间产物、只需要结论」的典型），裁剪把它藏起来后，
# 能不能用 sub-agent 变成了「模型走原生 function calling 还是 XML 兜底协议」的偶然结果。
allowed_tools:
  - extract_file_text
  - read_file
  - list_files
  - search_project_files
  - write_docx
  - run_python
  - todo_write
  - dispatch_subtask

# 输出结构约定（随 prompt 注入）
output: |
  两份 Word 交付物，均用 write_docx 写入 kick-off prompt 指定的 parentFolderId：
  1.「核查底稿_公司_届次.docx」——交叉核对底稿表（逐字段三源对照 + 议案三标签 + 表决复算，每项结论注明出处）
  2.「法律意见书_公司_届次.docx」——完整法律意见书
  <final> 中简述核查结论（一致项数量、发现的问题清单、【核实】事项），不要复述全文。
