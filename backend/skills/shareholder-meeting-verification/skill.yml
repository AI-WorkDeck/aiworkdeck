# 股东大会核查 Skill（打包格式见 docs/SKILL_SPEC.md）
id: shareholder-meeting-verification
name: 股东大会核查
description: 上市公司/挂牌公司股东会法律见证：对照股东大会通知、董事会决议公告与投票结果做逐字段交叉核对与表决复算，撰写（或按本所初稿填充）法律意见书，并生成可溯源的交叉核对底稿表。

# 法律事项类别（匿名统计用，枚举见 MatterCategory）
category: 资本市场证券

# 可用语言（EN 版 PR5）：本 skill 的交付物是中国证券法语境下的见证法律意见书
#（特别决议标签/累积投票/中小投资者单独计票/通知期限硬数字全部绑定中国法），
# 无法法域中立化，英文版下整体隐藏。缺省即 zh-CN，这里显式声明以自文档。
languages:
  - zh-CN

# 已下线（2026-08-17）：左栏入口已从 leftSidebarPlugins.js 移除，本 skill 随之停做。
# 注意 SkillRegistry 的种子化只在「第一次见到这个 id」时生效——存量安装里它仍是启用状态，
# 需要在插件广场手动停用；这里只保证新装机器不会再出现它。
enabled_by_default: false

# 触发条件：用户输入包含任一关键词即命中（面板 kick-off prompt 以「股东大会核查」开头）
triggers:
  - 股东大会核查
  - 股东会核查
  - 股东大会见证
  - 股东会见证
  - 见证法律意见书

# prompt 模板文件名（相对本目录）
prompt: prompt.md

# 工具白名单：命中后本轮 LLM 可见工具
#   = allowed_tools ∪ 基础工具集（ai.skills.base-tools）∪ 编排类工具（SkillRouter.ORCHESTRATION_TOOLS）
# 下面清单里的 todo_write / dispatch_subtask 现在已被编排类工具集恒定放行、属于冗余，
# 刻意保留：显式声明是自文档（删掉会让本文件读起来像"本 skill 不需要清单/不需要子 Agent"）。
# 基础工具集只有三个（read_document / list_files / query_memory，见 application.yml 的 ai.skills.base-tools），
# 所以凡是本 skill 要用的工具都必须在这里逐个列出——漏了就是「模型看不见 = 不会调用」。
# dispatch_subtask 曾经漏列：本 skill 是 system_prompt.md 第 6.5 节明确要委派的长程任务
#（逐份文件抽取字段本身就是「会产生大量中间产物、只需要结论」的典型），裁剪把它藏起来后，
# 能不能用 sub-agent 变成了「模型走原生 function calling 还是 XML 兜底协议」的偶然结果。
allowed_tools:
  - extract_file_text
  - read_file
  - list_files
  - search_project_files
  - write_docx
  - run_python
  - todo_write
  - dispatch_subtask

# 输出结构约定（随 prompt 注入）
output: |
  两份 Word 交付物，均用 write_docx 写入 kick-off prompt 指定的 parentFolderId：
  1.「核查底稿_公司_届次.docx」——交叉核对底稿表（逐字段三源对照 + 议案三标签 + 表决复算，每项结论注明出处）
  2.「法律意见书_公司_届次.docx」——完整法律意见书
  <final> 中简述核查结论（一致项数量、发现的问题清单、【核实】事项），不要复述全文。
  例外：命中 prompt「缺口处置」C 类时，开工前先输出一个 <question> 停下等回答，
  本轮不产出这两份文件——前提没定就动笔等于返工。
