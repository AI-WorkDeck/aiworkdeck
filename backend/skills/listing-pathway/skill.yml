# 上市路径选择比较分析 Skill（打包格式见 docs/SKILL_SPEC.md）
id: listing-pathway
name: 上市路径选择比较分析
description: 面向中国资本市场律师的上市/证券化路径比较分析：境内主板/创业板/科创板/北交所、港股、美股、红筹/VIE、借壳、分拆、被并购、SPAC 等路径的可行性筛选与逐维度比较。

# 法律事项类别（匿名统计用，枚举见 MatterCategory）
category: 资本市场证券

# 可用语言（EN 版 PR5）：候选路径全集/硬性闸门/人设都是中国资本市场，英文版下必须真隐藏——
# 下面的触发词含 IPO / SPAC / VIE 这类英文串，不隐藏的话英文用户输入 "IPO" 会被注入
# 一套中国上市路径分析，属于主动出错。缺省即 zh-CN，这里显式声明以自文档。
languages:
  - zh-CN

# 触发条件：用户输入包含任一关键词即命中（不区分大小写）。
# 匹配口径见 SkillRouter.containsTrigger：中文是子串匹配，**拉丁串两端要求整词**——
# 所以 IPO / VIE / SPAC 这三个缩写可以保留，「VIPO 品牌」「IPOS 系统」「view」「space」
# 不会再误命中（dev-board#818）。
# 中文那一端没有词边界可言，短到会被别的语境夹带的只能换成短语：
# 「红筹」→ 红筹架构 / 红筹上市，「借壳」→ 借壳上市，「证券化」→ 证券化路径 / 实现证券化
#（「证券化」原样留着会被「资产证券化」命中，那是 ABS，和上市路径无关）。
triggers:
  - 上市路径
  - 上市板块
  - IPO
  - 科创板
  - 北交所
  - 创业板上市
  - 主板上市
  - 红筹架构
  - 红筹上市
  - VIE
  - 借壳上市
  - 证券化路径
  - 实现证券化
  - 港股上市
  - 美股上市
  - SPAC
  - 分拆上市
  - 反向收购

# prompt 模板文件名（相对本目录）
prompt: prompt.md

# 工具白名单：命中后本轮 LLM 可见工具
#   = allowed_tools ∪ 基础工具集（ai.skills.base-tools）∪ 编排类工具（SkillRouter.ORCHESTRATION_TOOLS）
# 四类：法律检索（law_*）、网络搜索（search_web/browse_url）、成文输出（write_docx）、委派（dispatch_subtask）
# 基础工具集只有三个（read_document / list_files / query_memory，见 application.yml 的 ai.skills.base-tools），
# 要用的工具必须在这里逐个列出——漏了就是「模型看不见 = 不会调用」。
# dispatch_subtask 曾经漏列：逐条路径独立检索监管门槛正是 system_prompt.md 第 6.5 节
# 要求委派的形态（多轮搜索/浏览、只需要结论），裁剪把它藏起来后，能不能用 sub-agent
# 变成了「模型走原生 function calling 还是 XML 兜底协议」的偶然结果。
# 编排类工具（todo_write / dispatch_subtask）恒定可见、裁剪碰不到，**不要**为了"保险"
# 把 todo_write 也抄进下面的清单：回放评测用例 skill-orchestration-tools-not-trimmed 正是靠
# 「todo_write 不在本清单里却仍可见」来守这条不变式，抄进来会让那条断言变成空断言。
# 聚焦模式，限制本轮可见工具（dev-board#799）。这里写 restrict 是保持现状：
# 裁剪自本次起改成自愿声明，不写就等于把本 skill 的既有行为悄悄改掉
#（回放用例 skill-listing-pathway-trigger-trim-xml 与 skill-orchestration-tools-not-trimmed
# 都钉着本 skill 会裁剪）。
#
# 编辑面必须在清单里（dev-board#818）：触发词里仍有 IPO / VIE / SPAC 这类短缩写，
# 整词匹配挡得住「VIPO」却挡不住「帮我把这段 IPO 条款改一下」——中文语境的误命中无法根治。
# 清单里带上编辑面，误命中就从「AI 突然不会改文档了」退化成「指引不对但能力还在」，
# 而这个 skill 本来就常被要求「把比较结论写进当前这份备忘录」。
# doc_* 与 office_* 两族同时列出：ClientCapabilityService 按会话客户端只放行其中一族
#（工作台 LOWA 会话见 doc_*，Office/WPS 任务窗格会话见 office_*），这里不需要也不能替它挑。
tool_policy: restrict

allowed_tools:
  # 法源核实
  - law_search
  - law_search_keyword
  - get_law_article
  - law_recognition
  # 监管口径、交易所问答、境外规则
  - search_web
  - browse_url
  # 新起一份比较分析备忘录
  - write_docx
  - dispatch_subtask
  # 写进用户正打开的那份文档：先看结构再定落点
  - doc_get_document_text
  - doc_get_outline
  - doc_find_text
  - doc_get_cursor_context
  # 改
  - doc_insert_at_cursor
  - doc_insert_under_heading
  - doc_insert_table
  - doc_find_replace
  - doc_replace_selection
  # 安全网
  - doc_undo
  # Office/WPS 任务窗格会话的对应面
  - office_get_text
  - office_search
  - office_insert_text
  - office_replace_text
  - office_insert_table

# 输出结构约定（随 prompt 注入）
output: |
  最终交付一份结构化的《上市路径比较分析》：企业画像 → 可行路径筛选（含排除理由）→
  逐路径比较表（监管门槛/时间/成本/控制权影响/后续融资）→ 结论与初步建议。
  篇幅较长或用户明确要求成文时，用 write_docx 生成 Word 备忘录并在 <final> 中说明文件名。
  例外：画像要素缺失命中 prompt 第 1 步「一次问完」判据时，本轮只输出一个 <question>
  并停下等回答，不要为了凑交付而先给一份靠猜的比较分析。
