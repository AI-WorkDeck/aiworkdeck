# 诉讼可视化 Skill（打包格式见 docs/SKILL_SPEC.md）
#
# 出图引擎 vendor 自 mqc-litigation-visual-redraw（作者缪奇川，MIT），见仓库 litviz/。
# 本 skill 只教模型"怎么抽取"；几何全部由确定性脚本计算，模型不碰像素。
id: litigation-visual
name: 诉讼可视化
description: 把案件材料画成能直接进诉讼材料的专业图——事实经过时间轴、诉讼时效/保证期间甘特图、案件流程图、当事人关系图、股权控制结构树、A/B 对比表。原文逐字保留，只改视觉表达。

# 作者/版本/许可（面向用户展示，skill.yml 字段见 docs/SKILL_SPEC.md §3）。
# skill 本身是 AI Workdeck 编写的；出图引擎是另一码事，署名见下面的 credits。
author: AI Workdeck
author_url: https://www.aiworkdeck.com
version: 1.0.2
license: MIT

# 第三方内容署名：出图引擎 vendor 自 mqc-litigation-visual-redraw，MIT 协议要求保留版权声明。
# 版权行原样抄自 litviz/engine/LICENSE，改引擎版本时这里也要跟着改。
credits:
  - "出图引擎 mqc-litigation-visual-redraw v1.0.2 —— Copyright (c) 2026 缪奇川 (Miao Qichuan)，MIT License"

# 默认不安装：出图引擎（Python + graphviz）体积较大，随安装包分发但默认关闭；
# 用户在插件广场手动启用（= 安装），停用（= 卸载）不影响随包文件，见 SkillRegistry/SkillMarketService。
enabled_by_default: false

# 依赖的原生资源包（litviz 引擎 + graphviz + draw.io 静态资源，规范见
# docs/NATIVE_PACK_DISTRIBUTION.md）。随包内置资源还在的老版本不会触发下载。
requires_pack: litigation-visual

# 法律事项类别（匿名统计用，枚举见 MatterCategory）
category: 争议解决

# 可用语言（EN 版 PR5）：抽取→semantic-map.json→确定性出图的管线不绑定任何法域，
# 七种布局（时间轴/甘特/流程/关系/层级/对比表）都是普适诉讼图件，英文版可用。
# 英文侧文本：name_en / triggers_en / output_en 见下，英文 prompt 在 prompt.en.md。
languages:
  - zh-CN
  - en-US

name_en: Litigation Visualization

# 触发条件：用户输入包含任一关键词即命中（不区分大小写）
triggers:
  - 诉讼可视化
  - 案件时间轴
  - 事实经过时间轴
  - 时间轴
  - 大事记
  - 诉讼时效图
  - 保证期间
  - 案件流程图
  - 诉讼流程图
  - 当事人关系图
  - 法律关系图
  - 担保关系图
  - 股权结构图
  - 控制关系图
  - 关系图
  - 甘特图
  - 把这张图重画
  - 重画一下
  - 画成图
  - 出一张图
  - 做张图

# 英文触发词（仅 en-US 应用语言下参与匹配；zh-CN 匹配行为不受影响）。
# "timeline" / "gantt chart" 偏宽，与中文清单收录「时间轴」的取舍一致：先接受误触发风险。
triggers_en:
  - litigation visualization
  - case timeline
  - fact timeline
  - timeline
  - chronology
  - limitation period chart
  - guarantee period
  - case flowchart
  - litigation flowchart
  - party relationship map
  - relationship map
  - ownership structure chart
  - control structure
  - gantt chart
  - redraw this diagram
  - redraw it
  - turn this into a diagram
  - make a diagram
  - draw a chart

prompt: prompt.md

# 工具白名单：命中后本轮 LLM 可见工具 = allowed_tools ∪ 基础工具集（ai.skills.base-tools）。
# base-tools 只有三个（read_document / list_files / query_memory），所以每个要用的工具
# 都得逐条列出——漏一个就等于对模型隐藏了这个能力。
# 四类：出图三件套（litigation_*）、读材料（抽取阶段要通读文件夹）、落地（建文件夹）、
# 委派（dispatch_subtask）。
#
# dispatch_subtask：材料多时抽取是典型长程任务（逐份读判决书/证据再汇总成一份语义地图），
# 正是 prompts/system_prompt.md 第 6.5 节要委派子 Agent 的场景。两个既有 skill 曾漏列，
# 这里照它们的惯例带上。
allowed_tools:
  - litigation_reference
  - litigation_checkpoint
  - litigation_render
  - extract_file_text
  - search_project_files
  - read_file
  - create_folder
  - doc_list_project_files
  - dispatch_subtask

output: |
  交付 = 项目里一个以图名命名的文件夹，内含 .drawio（可继续编辑的源文件，出图后自动
  在编辑器打开）、.svg（母版，看与打印）、.png（唯一能插进正在写的文书的格式）。
  回复里给一句审计摘要：用了哪种布局与视觉模式、深红标在哪一处（或"未标"）、
  有哪些没读准的地方。这些话只出现在回复里，绝不画进图上。
  语义地图全程是工具参数，不要用 write_file/read_file 中转；用户确认后必须调用一次
  litigation_render，那一步才真正出图。

output_en: |
  Deliverable = one folder in the project, named after the figure, containing the .drawio
  (editable source file, opened in the editor automatically), the .svg (master copy, for
  viewing and printing), and the .png (the ONLY format that can be inserted into a document
  being drafted).
  In the reply, give a one-line audit summary: which layout and visual mode were used,
  where the crimson accent was placed (or "none"), and anything that could not be read with
  confidence. These remarks go in the reply ONLY - never onto the figure itself.
  The semantic map stays an inline tool argument - never stage it through write_file/read_file;
  after the user confirms you MUST call litigation_render once, that is what renders the figure.
