<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Web 插件</title>
<style>
  /* 主题（v2.6）：SDK 会把宿主的 --awd-* 令牌注入本页并挂 data-theme，
     插件 CSS 直接 var(--awd-*, fallback) 即可跟随深浅色；fallback 值兼容
     不注入令牌的老宿主（只在浅色下运行，取原浅色值即可）。 */
  :root { color-scheme: light; }
  :root[data-theme='dark'] { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--awd-bg, #F6F5F0);
    color: var(--awd-text, #2B2A26);
  }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--awd-text-2, #6B675C); }
  dd { margin: 0; font-family: var(--awd-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); word-break: break-all; }
  ul { margin: 0; padding: 0; list-style: none; }
  li { padding: 6px 0; border-bottom: 1px solid var(--awd-border-subtle, #EAE7DD); display: flex; gap: 10px; }
  li:last-child { border-bottom: 0; }
  li .name { flex: 1; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  li .size { color: var(--awd-text-3, #A8A296); font-variant-numeric: tabular-nums; }
  pre {
    margin: 10px 0 0; padding: 10px; max-height: 180px; overflow: auto;
    background: var(--awd-surface-2, #E9E6DC); border-radius: var(--awd-radius-md, 6px); font-size: 12px; white-space: pre-wrap;
  }
  .empty { color: var(--awd-text-3, #A8A296); }
</style>
</head>
<body>
  <main class="awd-plugin-stage">
    <header class="awd-plugin-header">
      <div>
        <div class="awd-eyebrow">AWD PLUGIN UI V3.0 · DEMO</div>
        <h1 class="awd-title">Hello Web 插件</h1>
        <p class="awd-subtitle">最小面板：握手上下文、项目文件、toast、插件级存储与文档桥各演示一次。</p>
      </div>
      <div class="awd-header-actions">
        <button id="toast" class="awd-btn awd-btn-primary">发一条 toast</button>
        <button id="count" class="awd-btn">记一次点击（storage）</button>
      </div>
    </header>

    <div class="awd-plugin-grid">
      <section class="awd-card">
        <div class="awd-card-header">
          <h2 class="awd-card-title">上下文</h2>
        </div>
        <dl id="ctx"><dd class="empty">等待宿主握手…</dd></dl>
      </section>

      <div>
        <section class="awd-card">
          <div class="awd-card-header">
            <h2 class="awd-card-title">项目文件</h2>
          </div>
          <ul id="files"><li class="empty">等待宿主握手…</li></ul>
          <pre id="preview" hidden></pre>
        </section>

        <section class="awd-card">
          <div class="awd-card-header">
            <h2 class="awd-card-title">底稿与文档 AI（规范 v2.7，需宿主 0.28+）</h2>
          </div>
          <div class="awd-header-actions">
            <button id="evidence" class="awd-btn">列当前文档的底稿关联（evidence.list）</button>
            <button id="doc-read" class="awd-btn">读当前文档全文（doc.exec）</button>
            <button id="doc-insert" class="awd-btn">光标处插入一句话（走修订）</button>
            <button id="ai-summary" class="awd-btn">AI 一句话总结全文（ai.request）</button>
            <label style="display:inline-flex;align-items:center;gap:6px;margin-left:4px;">
              <input type="checkbox" id="watch-files"> 订阅文件变化（events）
            </label>
          </div>
          <pre id="evidence-out" hidden></pre>
          <pre id="doc-out" hidden></pre>
        </section>
      </div>
    </div>
  </main>

  <!-- SDK 必须同步引入且排在业务脚本之前：宿主在 iframe load 后立刻发 init，
       晚注册监听会错过握手，ready() 将永远挂起。 -->
  <script src="awd-plugin-sdk.js"></script>
  <script>
    (async function () {
      var ctxEl = document.getElementById('ctx');
      var filesEl = document.getElementById('files');
      var previewEl = document.getElementById('preview');

      var ctx = await awd.ready();

      ctxEl.innerHTML = '';
      Object.keys(ctx).forEach(function (k) {
        var dt = document.createElement('dt'); dt.textContent = k;
        var dd = document.createElement('dd'); dd.textContent = String(ctx[k]);
        ctxEl.appendChild(dt); ctxEl.appendChild(dd);
      });

      // files.* 需要 manifest.permissions 含 file_read，未声明会抛 permission_denied
      try {
        var files = await awd.files.list();
        filesEl.innerHTML = '';
        if (!files.length) {
          filesEl.innerHTML = '<li class="empty">项目里还没有文件</li>';
        }
        files.forEach(function (f) {
          var li = document.createElement('li');
          var name = document.createElement('span');
          name.className = 'name';
          name.textContent = f.name || f.path;
          name.onclick = async function () {
            try {
              var doc = await awd.files.read(f.path);
              previewEl.hidden = false;
              previewEl.textContent = doc.content.slice(0, 2000) + (doc.truncated ? '\n…（已截断）' : '');
            } catch (e) {
              previewEl.hidden = false;
              previewEl.textContent = '读取失败：' + (e.code || '') + ' ' + e.message;
            }
          };
          var size = document.createElement('span');
          size.className = 'size';
          size.textContent = ((f.size || 0) / 1024).toFixed(1) + ' KB';
          li.appendChild(name); li.appendChild(size);
          filesEl.appendChild(li);
        });
      } catch (e) {
        filesEl.innerHTML = '<li class="empty">读取文件失败：' + (e.code || '') + ' ' + e.message + '</li>';
      }

      document.getElementById('toast').onclick = function () {
        awd.ui.toast('来自 ' + (ctx.pluginId || '插件') + ' 的问候');
      };

      // evidence.list 需要 file_read；没有聚焦的 Word 文档时宿主回 no_active_document
      document.getElementById('evidence').onclick = async function () {
        var out = document.getElementById('evidence-out');
        out.hidden = false;
        try {
          var r = await awd.evidence.list({});
          out.textContent = r.links.length
            ? JSON.stringify(r.links, null, 2)
            : '当前文档还没有底稿关联';
        } catch (e) {
          out.textContent = '读取失败：' + (e.code || '') + ' ' + e.message;
        }
      };

      document.getElementById('count').onclick = async function () {
        var n = (await awd.storage.get('clicks')) || 0;
        n = Number(n) + 1;
        await awd.storage.set('clicks', n);
        await awd.ui.toast('累计点击 ' + n + ' 次');
      };

      // ==== 规范 v2.7：doc.* / events / ai.request（老宿主回 unknown_method，如实显示即可）====
      var docOut = document.getElementById('doc-out');
      function showDoc(text) { docOut.hidden = false; docOut.textContent = text; }

      document.getElementById('doc-read').onclick = async function () {
        try {
          var r = await awd.doc.getText();
          showDoc(JSON.stringify(r, null, 2).slice(0, 2000));
        } catch (e) { showDoc('读取失败：' + (e.code || '') + ' ' + e.message); }
      };

      document.getElementById('doc-insert').onclick = async function () {
        try {
          await awd.doc.insertText('（来自 Hello Web 插件的问候）');
          showDoc('已插入——Writer 文档里这是一条署名 AI WorkDeck 的修订，可接受/拒绝');
        } catch (e) { showDoc('插入失败：' + (e.code || '') + ' ' + e.message); }
      };

      document.getElementById('ai-summary').onclick = async function () {
        showDoc('AI 请求中…');
        try {
          var r = await awd.doc.getText();
          var text = JSON.stringify(r).slice(0, 8000);
          var out = await awd.ai.request('用一句话概括这份文档内容：' + text, { purpose: 'demo-summary' });
          showDoc(out || '（空响应）');
        } catch (e) { showDoc('AI 请求失败：' + (e.code || '') + ' ' + e.message); }
      };

      var offFiles = null;
      document.getElementById('watch-files').onchange = function (ev) {
        if (ev.target.checked) {
          offFiles = awd.events.on('files.changed', function () {
            awd.ui.toast('项目文件有变化（files.changed）');
          });
          showDoc('已订阅 files.changed：文件树任何刷新都会收到通知');
        } else if (offFiles) {
          offFiles(); offFiles = null;
          showDoc('已退订 files.changed');
        }
      };
    })();
  </script>
</body>
</html>
