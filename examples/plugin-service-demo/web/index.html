<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宿主服务示例</title>
<style>
body{margin:16px;font:13px/1.6 system-ui;color:var(--awd-text,#222);background:var(--awd-surface,#fff)}section{margin-bottom:20px}h1{font-size:16px}h2{font-size:14px}input,textarea,button{box-sizing:border-box;font:inherit;border:1px solid var(--awd-border,#ccc);border-radius:4px;color:inherit;background:var(--awd-surface,#fff)}input,textarea{display:block;width:100%;padding:6px;margin:5px 0}button{min-height:32px;padding:4px 8px;margin:4px 4px 4px 0;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--awd-accent,#315e53);outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(pointer:coarse){button,input{min-height:48px}}
</style></head><body>
<h1>宿主服务示例</h1><p>每项操作均由按钮触发。连接凭据在宿主窗口输入；示例不会读取密钥。自带服务地址为占位地址，接入前请修改 manifest。</p>
<section><h2>插件设置</h2><label>问候语<input id="greeting" value="你好"></label><button data-action="settingsOpen">打开宿主设置</button><button data-action="settingsSave">保存设置</button></section>
<section><h2>宿主 AI 与项目搜索</h2><label>输入<textarea id="prompt">用一句话说明这个示例的用途。</textarea></label><button data-action="ai">请求宿主 AI（使用账户额度）</button><button data-action="search">搜索当前项目</button><button id="cancel" disabled>取消当前请求</button></section>
<section><h2>自带服务</h2><button data-action="connect">在宿主连接服务</button><button data-action="disconnect">断开</button><button data-action="provider">请求声明的服务操作</button></section>
<section><h2>MCP</h2><button data-action="servers">列出可用服务器</button><label>服务器 ID<input id="server"></label><label>工具名<input id="tool"></label><button data-action="mcp">调用所填工具（空参数）</button></section>
<section><h2>订阅</h2><button data-action="hostBilling">宿主账户权益</button><button data-action="providerBilling">自带服务订阅状态</button><button data-action="checkout">打开服务商订阅页</button><p>订阅页由服务商声明；本示例不提供平台代收或分账。</p></section>
<pre id="result" role="status" aria-live="polite">等待宿主握手…</pre>
<script src="awd-plugin-sdk.js"></script><script src="app.js"></script>
</body></html>
