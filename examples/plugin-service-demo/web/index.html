<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宿主服务示例</title>
<style>
body{margin:16px;font:13px/1.6 system-ui;color:var(--awd-text,#222);background:var(--awd-surface,#fff)}section{margin-bottom:20px}h1{font-size:16px}h2{font-size:14px}input,textarea,select,button{box-sizing:border-box;font:inherit;border:1px solid var(--awd-border,#ccc);border-radius:4px;color:inherit;background:var(--awd-surface,#fff)}input,textarea,select{display:block;width:100%;padding:6px;margin:5px 0;min-height:32px}button{min-height:32px;padding:4px 8px;margin:4px 4px 4px 0;cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--awd-accent,#315e53);outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#result[data-error=true]{color:var(--awd-danger-text,#9a3a30)}@media(pointer:coarse){button,input,select{min-height:48px}}
</style></head><body>
<h1>宿主服务示例</h1><p>每项操作均由按钮触发。连接凭据仅在宿主窗口输入；示例不会读取密钥。请先将 manifest 中的占位地址替换为自己的服务。</p>
<section><h2>插件设置</h2><label for="greeting">问候语</label><input id="greeting" value="你好"><button data-action="settingsOpen">打开宿主设置</button><button data-action="settingsSave">保存设置</button></section>
<section><h2>共享宿主通道</h2><label for="prompt">输入</label><textarea id="prompt">用一句话说明这个示例的用途。</textarea><button data-action="ai">请求宿主 AI（使用宿主当前通道与额度）</button><button data-action="search">搜索当前项目</button></section>
<section><h2>自带服务：独立登录</h2><p>Bearer：<span id="example-provider-status">未查询</span> · OAuth：<span id="oauth-provider-status">未查询</span></p><button data-action="connections">刷新连接状态</button><label for="provider">要操作的服务连接</label><select id="provider"><option value="example-provider">Bearer 服务</option><option value="oauth-provider">OAuth 服务</option></select><button data-action="connect">在宿主连接所选服务</button><button data-action="disconnect">断开所选服务</button><button data-action="provider">请求所选服务</button><p>OAuth 登录在外部授权页面完成，返回后刷新连接状态。打开设置不等于连接成功。</p></section>
<section><h2>MCP</h2><button data-action="servers">列出可用服务器</button><label for="server">服务器 ID</label><input id="server" value="example-mcp"><label for="tool">工具名</label><input id="tool" value="echo"><label for="arguments">工具参数（JSON 对象）</label><textarea id="arguments">{"text":"你好，MCP"}</textarea><button data-action="mcp">调用工具</button></section>
<section><h2>独立付费与权益</h2><button data-action="hostBilling">查询此插件的平台购买权益</button><button data-action="hostCheckout">打开平台购买入口</button><button data-action="providerBilling">查询所选服务的订阅</button><button data-action="checkout">打开所选服务的订阅页</button><p>平台购买权益与服务商订阅相互独立。打开页面不是付款成功；完成后需重新查询实际状态。本示例不自动付款，也不提供按调用代收或分账。</p></section>
<button id="cancel" disabled>取消当前请求</button><pre id="result" role="status" aria-live="polite">等待宿主握手…</pre>
<script src="awd-plugin-sdk.js"></script><script src="app.js"></script>
</body></html>
