<html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>AI WorkDeck 原生文档实验</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#edf0f3;color:#202831;font:14px system-ui}header{height:64px;padding:12px 20px;background:white;border-bottom:1px solid #ccd1d6}small{display:block;color:#66717c;margin-top:4px}main{height:calc(100vh - 64px);display:grid;grid-template-columns:200px minmax(400px,1fr) 290px}aside{min-height:0;overflow:auto;padding:14px;border-right:1px solid #ccd1d6}button,select{font:inherit;padding:7px 10px;border:1px solid #bec8d0;border-radius:5px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#projects button{display:block;width:100%;margin:8px 0;text-align:left;overflow-wrap:anywhere}#editor{min-width:0;min-height:0;display:flex;flex-direction:column}#toolbar{display:flex;gap:6px;align-items:center;padding:10px;background:#f8fafb;min-height:58px}#status{margin-left:auto;font-size:12px;max-width:260px;overflow-wrap:anywhere}#viewport{position:relative;overflow:auto;flex:1;min-height:0;background:#d9dfe3}#document-layer{position:relative;margin:0 auto;width:800px;min-height:100%}canvas{position:absolute;left:0;top:0;background:#d9dfe3;touch-action:none}#panels{border-left:1px solid #ccd1d6;background:#f8fafb;padding:10px}#panel-tabs{display:flex;gap:6px;margin-bottom:10px}.item{padding:10px;margin:8px 0;background:white;border:1px solid #d8dfe4;border-radius:6px;overflow-wrap:anywhere}.item p{margin:6px 0;white-space:pre-wrap}.actions{display:flex;gap:6px;margin-top:8px}.meta{color:#63717c;font-size:12px}.active{outline:2px solid #528d7b}#version-title{width:100%;padding:8px;margin:8px 0}#versions[hidden],#revisions[hidden]{display:none}#notice{font-size:12px;color:#63717c}#revision-count{margin:10px 0;font-weight:600}
</style>
<header>AI WorkDeck 原生文档实验<small>隔离的测试项目 · 保存与恢复结果均需验证</small></header>
<main><aside><div id="projects">读取项目…</div><p id="notice"></p></aside>
<section id="editor"><div id="toolbar"><button id="save" disabled>保存</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><select id="view-mode" disabled aria-label="修订显示"><option value="all">显示修订</option><option value="final">最终稿</option></select><span id="status" role="status">请选择文档</span></div><div id="viewport"><div id="document-layer"><canvas id="document" width="1" height="1"></canvas></div></div></section>
<aside id="panels"><div id="panel-tabs"><button id="show-revisions">审阅</button><button id="show-history" disabled>版本历史</button></div><section id="revisions"><div id="revision-count">尚未打开文档</div><div id="revision-items"></div></section><section id="versions" hidden><input id="version-title" aria-label="版本名称" placeholder="版本名称"><button id="create-version">保存一个版本</button><div id="version-items"></div></section></aside></main>
<script src="document-input.js"></script><script src="renderer.js"></script></html>
