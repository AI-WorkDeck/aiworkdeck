<!--
  安装进行时的右上角小卡片背景（360x132，24 位 BMP）。
  进度条是真控件，盖在 (20,96,320,10)=AWDUI_BAR 的浅色轨道上。
  参数：?lang=zh|en&product=desktop|addin
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 360px; height: 132px; overflow: hidden; }
  body {
    position: relative; background: #FFFFFF;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 0; border: 1px solid #DCE5DF; z-index: 9; }
  .accent {
    position: absolute; left: 0; top: 0; width: 360px; height: 3px;
    background: linear-gradient(90deg, #1D6440 0%, #5BD197 60%, #A6EFCA 100%);
  }
  .logo { position: absolute; left: 20px; top: 17px; width: 24px; height: 24px; border-radius: 6px; }
  .brand {
    position: absolute; left: 52px; top: 20px;
    font-size: 14px; font-weight: 600; color: #17301F; letter-spacing: 0.02em;
  }
  /* 状态行：主文案 + 右侧弱化的版本号（?ver= 传入，空则隐藏） */
  .status {
    position: absolute; left: 20px; top: 60px;
    font-size: 13px; color: #44524A; letter-spacing: 0.02em;
  }
  .hint {
    position: absolute; right: 20px; top: 61px;
    font-size: 11px; color: #9DAFA3; letter-spacing: 0.14em;
  }
  /* 轨道 (20,100,320,6)=AWDUI_BAR：真进度条剥掉系统主题后是扁平色块，
     叠在这条圆角浅薄荷轨道上 */
  .track {
    position: absolute; left: 20px; top: 100px; width: 320px; height: 6px;
    border-radius: 3px; background: #ECF2EE;
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <img class="logo" src="../icon.png" alt="">
  <div class="brand">AI WorkDeck</div>
  <div class="status"
       data-zh-desktop="正在安装，请稍候" data-en-desktop="Installing, just a moment"
       data-zh-addin="正在安装 Office 插件" data-en-addin="Installing the Office add-in"></div>
  <div class="hint"></div>
  <div class="track"></div>
  <div class="frame"></div>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'zh';
  const product = q.get('product') === 'addin' ? 'Addin' : 'Desktop';
  for (const el of document.querySelectorAll('[data-zh-desktop]')) el.textContent = el.dataset[lang + product];
  const ver = q.get('ver');
  if (ver) document.querySelector('.hint').textContent = 'V ' + ver;
</script>
</body>
</html>
