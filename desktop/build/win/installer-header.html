<!--
  Windows 安装器内页页眉图（MUI2 header，150x57，24 位 BMP，置于对话框左上，
  右侧是系统本地化的页标题文字）。改完跑 `node scripts/render-win-installer-art.mjs`。
  背景保持纯白（与 MUI 页眉条同色），只放品牌字标 + 薄荷点缀。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 150px; height: 57px; overflow: hidden; }
  body {
    position: relative;
    background: #FFFFFF;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wordmark {
    position: absolute; top: 19px; left: 16px;
    font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
    color: #1A5336;
  }
  .accent {
    position: absolute; top: 40px; left: 17px;
    width: 30px; height: 2px;
    background: linear-gradient(90deg, #1A5336 0%, #5BD197 100%);
  }
</style>
</head>
<body>
  <div class="wordmark">AI WorkDeck</div>
  <div class="accent"></div>
</body>
</html>
