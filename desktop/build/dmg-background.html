<!--
  macOS DMG 安装窗口的背景图源文件。改完这里，在本目录下重新生成两张 PNG：

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
    --hide-scrollbars --force-device-scale-factor=1 --window-size=3840,2160 \
    --screenshot="$PWD/background.png" "file://$PWD/dmg-background.html"

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
    --hide-scrollbars --force-device-scale-factor=2 --window-size=3840,2160 \
    --screenshot="$PWD/background@2x.png" "file://$PWD/dmg-background.html"

  electron-builder 会自动把 background.png 与 background@2x.png 合成 hidpi TIFF（tiffutil）。
  背景图比窗口大（dev-board#580）：Finder 把背景按原尺寸贴在窗口左上角、不拉伸，用户把窗口
  拉大时图外露白。所以画布远大于窗口，设计主体只占左上 660x420，其余是延展区；默认窗口
  尺寸靠 package.json 的 build.dmg.window 显式钉在 660x420（不写的话 electron-builder
  会拿背景图尺寸当窗口尺寸）。图标落位见 build.dmg.contents，与本图光晕/箭头一起改：
  图标中心为 (170, 238) 与 (490, 238)，iconSize 128。
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 画布 = 截图视口（渲染命令的 --window-size），设计主体固定在左上 660x420。
     下面的渐变位置与色标都写成 px（由原先相对 660x420 的百分比换算），主体区在任何
     画布尺寸下保持原样，超出部分就是同一组渐变的自然延续——Finder 窗口被拉大时不露白。 */
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    position: relative;
    background:
      radial-gradient(600px 360px at 66px 504px, rgba(91, 209, 151, 0.26) 0%, rgba(91, 209, 151, 0) 64%),
      radial-gradient(640px 400px at 673.2px 243.6px, rgba(26, 83, 54, 0.14) 0%, rgba(26, 83, 54, 0) 62%),
      linear-gradient(180deg, #FAFCFB 0px, #F0F6F2 243.6px, #E6F0EA 420px);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部品牌带，横贯整个画布。112deg 渐变线起点由左上角决定、与盒宽无关，
     px 色标（原 54%/100% × 660x104 盒的渐变线长 650.9px）在更宽的盒里不变，过终点钳在 #1D6440 */
  .band {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 104px;
    overflow: hidden;
    background:
      radial-gradient(420px 220px at 580.8px -24.96px, rgba(91, 209, 151, 0.36) 0%, rgba(91, 209, 151, 0) 68%),
      linear-gradient(112deg, #0E3320 0px, #174C31 351.5px, #1D6440 650.9px);
  }
  /* 分隔线只在主体宽度内，两端本就淡出，延展区里不需要它 */
  .band-rule {
    position: absolute; top: 102px; left: 0;
    width: 660px; height: 2px;
    background: linear-gradient(90deg,
      rgba(91,209,151,0) 0%, #5BD197 24%, #A6EFCA 50%, #5BD197 76%, rgba(91,209,151,0) 100%);
  }
  /* 电路走线，呼应 logo 底座；中间留白避开文字。右侧三条从画布右缘进来（原先从 660 处进来），
     遮罩色标按原 660 宽换算成 px，主体区里的明暗分布不变 */
  .band-traces {
    position: absolute; left: 0; top: 4px;
    -webkit-mask-image: linear-gradient(90deg, #000 0px, #000 92.4px, transparent 211.2px, transparent 448.8px, #000 567.6px, #000 100%);
  }

  .wordmark {
    position: absolute; top: 30px; left: 0; width: 660px;
    text-align: center;
    font-size: 25px; font-weight: 600; letter-spacing: 0.005em;
    color: #FFFFFF;
  }
  .tagline {
    position: absolute; top: 68px; left: 0; width: 660px;
    text-align: center;
    font-size: 11.5px; font-weight: 400; letter-spacing: 0.16em;
    color: rgba(220, 248, 234, 0.78);
  }

  /* 图标落位光晕：把图标从底色上托起来 */
  .halo {
    position: absolute; top: 126px;
    width: 224px; height: 224px; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.80) 40%, rgba(255,255,255,0) 70%);
  }
  .halo.app  { left: 58px; }
  .halo.apps { left: 378px; }

  /* 拖拽指向，中心与图标中心同高 */
  .arrow { position: absolute; top: 226px; left: 274px; }

  /* 底部留出 Finder 状态栏（新系统即使 bwsp 关掉也可能画一条），文字别贴底 */
  .caption {
    position: absolute; top: 336px; left: 0; width: 660px;
    text-align: center;
    font-size: 12.5px; letter-spacing: 0.04em;
    color: rgba(15, 46, 30, 0.5);
  }
</style>
</head>
<body>
  <div class="band">
    <svg class="band-traces" width="100%" height="96" fill="none"
         stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round">
      <path d="M-10 22 H70 L84 36 H176"/>
      <path d="M-10 58 H36 L50 44 H144"/>
      <path d="M-10 86 H108 L122 72 H186"/>
      <path d="M9999 28 H592 L578 42 H486"/>
      <path d="M9999 64 H626 L612 50 H516"/>
      <path d="M9999 88 H556 L542 74 H474"/>
      <g fill="rgba(166,239,202,0.42)" stroke="none">
        <circle cx="176" cy="36" r="2"/>
        <circle cx="144" cy="44" r="2"/>
        <circle cx="486" cy="42" r="2"/>
        <circle cx="474" cy="74" r="2"/>
      </g>
    </svg>
    <div class="wordmark">AI WorkDeck</div>
    <div class="tagline">面向法律与文档密集型团队的 AI 原生工作台</div>
  </div>
  <div class="band-rule"></div>

  <div class="halo app"></div>
  <div class="halo apps"></div>

  <svg class="arrow" width="112" height="24" viewBox="0 0 112 24" fill="none">
    <defs>
      <linearGradient id="stem" x1="0" y1="0" x2="112" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5BD197" stop-opacity="0"/>
        <stop offset="0.36" stop-color="#4CBF89" stop-opacity="0.92"/>
        <stop offset="1" stop-color="#1A5336"/>
      </linearGradient>
    </defs>
    <path d="M2 12 H88" stroke="url(#stem)" stroke-width="3" stroke-linecap="round"/>
    <path d="M85 3 L110 12 L85 21 L92 12 Z" fill="#1A5336"/>
  </svg>

  <div class="caption">将 AI WorkDeck 拖入右侧 Applications 文件夹即可完成安装</div>
</body>
</html>
