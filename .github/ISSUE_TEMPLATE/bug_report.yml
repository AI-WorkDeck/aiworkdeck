name: 问题反馈 / Bug report
description: 报告可复现的问题 / Report a reproducible problem in AI WorkDeck
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提问、求助请到 [Discussions Q&A](https://github.com/AI-WorkDeck/aiworkdeck/discussions/categories/q-a)；安全漏洞请走[私密报告](https://github.com/AI-WorkDeck/aiworkdeck/security/advisories/new)，不要公开提交。
        Thanks for the report. Questions go to [Discussions Q&A](https://github.com/AI-WorkDeck/aiworkdeck/discussions/categories/q-a); report vulnerabilities [privately](https://github.com/AI-WorkDeck/aiworkdeck/security/advisories/new).

        **请勿上传客户文件、案卷或任何保密信息。** 需要样本时请用脱敏或自造的文件。
        **Do not attach client documents or any confidential material.** Use redacted or synthetic samples.
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened?
      description: 实际结果与预期结果 / Actual vs. expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 设置 → 关于，或桌面菜单「关于 AI WorkDeck」/ Settings → About.
      placeholder: "0.80.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 使用形态 / Where did it happen?
      multiple: true
      options:
        - 桌面版 macOS / Desktop (macOS)
        - 桌面版 Windows / Desktop (Windows)
        - 桌面版 Linux / Desktop (Linux)
        - 自部署 Web / Self-hosted web
        - Office / WPS 加载项 / Office or WPS add-in
        - 插件 / Plugin
        - 从源码开发 / Running from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 粘贴前删除 API Key、令牌和保密内容 / Remove API keys, tokens and confidential content first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已搜索过现有 issue，没有重复 / I searched existing issues and this is not a duplicate.
          required: true
        - label: 我提交的内容不含客户保密信息 / My report contains no confidential client information.
          required: true
