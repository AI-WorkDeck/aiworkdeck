name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  spdx-check:
    name: SPDX header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-spdx.mjs 用 origin/master 做 diff base，要能看到该分支的完整历史。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check new files carry SPDX headers
        run: node scripts/check-spdx.mjs
      # 配色守卫：色源 sha256（三仓逐字节相同）、令牌生成区段无手改漂移、
      # WCAG 对比度复算与硬闸。零依赖，跟 SPDX 检查共用这个轻量 job。
      - name: Check color palette and generated tokens
        run: node scripts/check-palette.mjs
      - name: Check migrated design tokens and iframe contract
        run: node scripts/check-design-system.mjs
      - name: Test design token guards and control behavior
        run: node --test frontend/tests/design-system/*.test.mjs frontend/tests/plugin-sdk/theme-channel.test.mjs
      # 两族编辑工具对拍（dev-board#806）：同一件事在工作台（doc_/sheet_/slide_）与
      # Office/WPS 任务窗格（office_*）各有一套工具名，会话按客户端只放行一族——
      # 一族缺了什么，那件事在那个客户端上就是沉默地做不了。同时查 skill 白名单，
      # 审计 A10 就是 contract-review 列了 doc_reply_comment 却漏了 office_reply_comment。
      - name: Check tool parity between LOWA and Office families
        run: node scripts/check-tool-parity.mjs
      - name: Check multi-language tokenization and locale parity
        working-directory: frontend
        run: npm run check:locales

  backend:
    # Keep the required check identity; verify also exercises the packaged contract.
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install plugin-api (host SPI, local artifact)
        # backend 以普通依赖引用 com.checkba:plugin-api，它是 backend/plugin-api 独立工程，
        # 不在任何远端仓库，必须先 install 进本机 ~/.m2 再跑 backend 的 Maven。
        run: mvn -B -q -f backend/plugin-api/pom.xml install
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test DPIA workbench plugin
        run: ./official-plugins/dpia-workbench/build.sh
      - name: Build and test Tencent Meeting marketplace plugin
        run: ./official-plugins/tencent-meeting/build.sh
      - name: Build and test Baoqingtian marketplace plugin
        run: ./official-plugins/baoqingtian/build.sh
      - name: Test
        working-directory: backend
        # backend/pom.xml configures the real TCP ForkNodeFactory. A JVM -D...factory
        # property does not configure that Maven parameter; native output corrupted reports (#1709).
        run: mvn -B verify
      - name: Verify and summarize Surefire report integrity
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('target/surefire-reports')
          reports, problems = [], []
          for path in sorted(root.glob('TEST-*.xml')):
              suite = ET.parse(path).getroot()
              name = suite.get('name', '')
              cases = suite.findall('testcase')
              counts = {key: int(suite.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped')}
              actual = {'tests': len(cases), **{key: sum(c.find(tag) is not None for c in cases)
                        for key, tag in (('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped'))}}
              if counts != actual:
                  problems.append('testcase counts differ: ' + name)
              for case in cases:
                  owner = case.get('classname', '')
                  if owner != name and not owner.startswith(name + '$'):
                      problems.append('testcase assigned to another suite: ' + name + ' / ' + owner)
              reports.append({'suite': name, 'counts': counts, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'cases': [{'class': c.get('classname'), 'name': c.get('name'),
                    'result': next((tag for tag in ('failure', 'error', 'skipped') if c.find(tag) is not None), 'passed')}
                    for c in cases]})
          if not reports:
              problems.append('no test reports produced')
          probe = next((r for r in reports if r['suite'] == 'com.checkba.SurefireTransportIntegrityTest'), None)
          if probe is None or probe['counts'] != {'tests': 2, 'failures': 0, 'errors': 0, 'skipped': 0}:
              problems.append('native output transport probe report missing or incomplete')
          for dump in root.glob('*.dumpstream'):
              if 'Corrupted channel' in dump.read_text(errors='replace'):
                  problems.append('fork event channel corrupted: ' + dump.name)
          summary = {'suites': reports, 'problems': problems}
          pathlib.Path('target/surefire-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2))
          print('Surefire report integrity: %d suites; %d problems' % (len(reports), len(problems)))
          for problem in problems:
              print(problem)
          if problems:
              raise SystemExit(1)
          PY
      - name: Save Surefire report evidence without test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-summary-${{ github.sha }}
          path: backend/target/surefire-summary.json
          if-no-files-found: warn
          retention-days: 14

  dpia-reports:
    name: DPIA report lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document rendering dependencies
        run: |
          python -m pip install -r official-plugins/dpia-workbench/runtime/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk fonts-wqy-zenhei
      - name: Test original workflow and native report lifecycle
        env:
          DSH_DPIA_PYTHON: python
          AWD_DPIA_SOFFICE: /usr/bin/soffice
        run: |
          node --test official-plugins/dpia-workbench/runtime/upstream/test/*.mjs official-plugins/dpia-workbench/tests/lifecycle.test.mjs
          python official-plugins/dpia-workbench/runtime/upstream/test/template-preservation.test.py
          python official-plugins/dpia-workbench/runtime/upstream/test/native-pdf.test.py
          python official-plugins/dpia-workbench/tests/test_render.py
          python official-plugins/dpia-workbench/tests/test_office_discovery.py

  frontend:
    name: Frontend (build:h5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        # 原来是 npm ci || npm install：lockfile 真漂了的话 npm install 会悄悄改写
        # package-lock.json 并让构建照样通过，等于没有任何 lockfile 漂移守卫（同文件
        # desktop job 一直是干净的 npm ci）。本地验证过 frontend/ 的 lockfile 与
        # package.json 一致（npm ci 能正常跑通），收紧成单纯 npm ci。
        run: npm ci
      - name: Test plugin platform, SDK and developer packaging
        run: node --test frontend/tests/calendar/*.test.mjs frontend/tests/plugins/*.test.mjs sdk/plugin-sdk/tests/*.test.mjs scripts/tests/plugin-dev.test.mjs
      - name: Test incremental speech playback
        working-directory: frontend
        run: npm run test:tts
      - name: Test project IM plugin and bridge
        run: node --test official-plugins/project-im/tests/*.mjs frontend/tests/plugin-sdk/im-*.test.mjs
      - name: Test DPIA native navigation boundaries
        run: node --test frontend/tests/plugin-sdk/dpia-navigation.test.mjs
      - name: Test Tencent Meeting plugin panel
        run: node --test official-plugins/tencent-meeting/tests/web-*.mjs
      - name: Test Baoqingtian plugin workspace
        run: NODE_PATH=frontend/node_modules node --test official-plugins/baoqingtian/tests/web-*.mjs
      - name: Test built-in Tencent Meeting request and UI contracts
        run: node --test frontend/tests/tmeet/*.test.mjs
      - name: Check emit/binding contracts
        working-directory: frontend
        run: npm run check:emits
      - name: Check locale key parity (zh-CN vs en-US)
        working-directory: frontend
        run: npm run check:locales
      - name: Check navigation contracts
        working-directory: frontend
        run: npm run check:nav:full
      - name: Test AI inbox, submission and memory state
        working-directory: frontend
        run: node --test tests/ai-alignment/*.test.mjs
      - name: Test account and paid-service access
        working-directory: frontend
        run: npm run test:account
      - name: Test unified account project catalog
        working-directory: frontend
        run: node --test tests/project-catalog.test.mjs
      - name: Test project-home page
        working-directory: frontend
        run: npm run test:project-home
      - name: Test independent litigation generation
        working-directory: frontend
        run: node --test tests/litigation-visual/*.test.mjs
      - name: Test editor opening and preview fallback
        working-directory: frontend
        run: npm run test:editor-open
      - name: Test native editor transport, input and review guards
        run: npm --prefix desktop run test:native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native UNO guards (real macOS engine acceptance is separate)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s desktop/tests -p 'test_native_*.py'
          python desktop/prototypes/native-lok/test_review_view.py
      - name: Test media player pure logic (cues / CC 状态 / 快捷键 / 取源)
        working-directory: frontend
        run: npm run test:media
      - name: Test LibreOffice relay (迟到结果墓碑 + 三张预算表键集合对齐)
        working-directory: frontend
        run: npm run test:zeta-relay
      - name: Test EvidenceLink pure functions (anchor hash 双端对拍 / locator / 拖放建链)
        working-directory: frontend
        run: npm run test:evidence
      - name: Test command registry (加速键归属与 when 求值)
        working-directory: frontend
        run: npm run test:commands
      - name: Tab visibility contract (dev-board#394)
        working-directory: frontend
        run: npm run test:tab-visibility
      - name: Titlebar drag-region contract (全屏浮层必须 no-drag，B4 / 0907 B10)
        working-directory: frontend
        run: npm run test:window-chrome
      - name: Feedback entry contract (rail 底部固定图标，不许再有浮钮，dev-board#755)
        working-directory: frontend
        run: npm run test:feedback-widget
      - name: Clipboard capture gate + delete chain (dev-board#455)
        working-directory: frontend
        run: npm run test:clipboard
      - name: OCR overlay style contract (dev-board#474)
        working-directory: frontend
        run: npm run test:ocr-overlay
      - name: Capability slots settings section contract (dev-board#497)
        working-directory: frontend
        run: npm run test:capabilities
      - name: Team panel + locale contracts (dev-board#496)
        working-directory: frontend
        run: npm run test:team
      - name: Member invite lookup + case-library share rules
        working-directory: frontend
        run: npm run test:member-invite
      - name: Display-name-only identity contract (dev-board#564–#567)
        working-directory: frontend
        run: npm run test:identity
      - name: Commit history tab, lane graph, member dedupe, collab wording (dev-board#623–#625)
        working-directory: frontend
        run: npm run test:version-history
      - name: Three-way merge unit tests (merge rows, auto-merge flow, provenance align, history merges, dev-board#630–#632)
        working-directory: frontend
        run: npm run test:version-merge
      - name: Desensitize pane custom-words entry (dev-board#531)
        working-directory: frontend
        run: npm run test:desensitize
      - name: Plugin SDK contracts (副本一致 + 握手信封 awd:1，dev-board#506)
        working-directory: frontend
        run: npm run test:plugin-sdk
      - name: LOWA worker pure-function + 命名前缀契约 (dev-board#506)
        working-directory: frontend
        run: npm run test:lowa-unit
      - name: Writing assistance contracts (dev-board#538)
        working-directory: frontend
        run: npm run test:completion

      - name: Document insight and link preview tests
        working-directory: frontend
        run: npm run test:insight
      - name: Confirmed contract review standards and results
        working-directory: frontend
        run: node --test tests/contract-review/*.test.mjs
      - name: Office verification API and installer build guards
        run: node --test office-addin/taskpane/lib/api.test.js office-addin/scripts/*.test.mjs
      - name: Inline review contracts (dev-board#547)
        working-directory: frontend
        run: npm run test:inline-review
      - name: "Revision view / IME overlay contracts (dev-board#587 #606)"
        working-directory: frontend
        run: npm run test:revision-view
      - name: Optional components prompts (dev-board#530)
        working-directory: frontend
        run: npm run test:optional-components
      - name: External software preparation
        working-directory: frontend
        run: npm run test:external-dependencies
      - name: Test local redaction panel
        working-directory: frontend
        run: node --test tests/desensitize/*.test.mjs
      - name: "Captcha embed + unlock site language (dev-board#863 #864)"
        working-directory: frontend
        run: npm run test:captcha && npm run test:unlock
      - name: Test browser-safe build chunks
        working-directory: frontend
        run: node --test tests/build/*.test.mjs
      - name: Build H5
        working-directory: frontend
        run: npm run build:h5

  desktop:
    name: Desktop (install deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
