name: full-upgrade-mac-smoke
on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Successful signed baseline build containing the full updater
        required: true
        default: '39939848049'
      baseline_sha:
        description: Exact expected baseline source commit
        required: true
        default: '58d7fbacbab68a19179467e8b53f0bf4a244adb7'
      candidate_run_id:
        description: Successful signed candidate build
        required: true
      candidate_sha:
        description: Exact expected candidate source commit
        required: true
      baseline_version:
        description: Baseline version
        required: true
        default: '0.71.0'
      candidate_version:
        description: Candidate version
        required: true
        default: '0.72.0'
permissions:
  contents: read
  actions: read
jobs:
  native-upgrade:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise genuine signed bundles, Squirrel, ordinary quit and manual reopen
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node desktop/scripts/test-full-upgrade-mac.mjs
      - name: Preserve provenance, signatures, screenshots and ShipIt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-upgrade-mac-quit-${{ github.run_attempt }}
          path: evidence/mac-upgrade/
          retention-days: 7
          if-no-files-found: error
