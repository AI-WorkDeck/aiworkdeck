#
# 产品截图即测试（设计：docs/plans/stella-alignment/screenshots.md）。
# 在虚构演示项目上截取工作台截图，与 docs/images/marketing/e2e/ 的基线逐像素比对。
# - PR / master：check 模式，界面变了就红，diff 图随 artifact 上传。
# - 手动 workflow_dispatch(mode=update)：只产出新截图 artifact，不改仓库；人审后下载入库。
# 基线只认本工作流产出的图（同一 runner 镜像 + 同一 Chrome 版本 + Noto CJK），不要提交本机截图。
name: Marketing screenshots

on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/static/**'
      - 'frontend/package-lock.json'
      - 'frontend/tests/marketing-screenshots/**'
      - 'backend/src/**'
      - 'backend/pom.xml'
      - 'backend/skills/**'
      - 'official-plugins/**'
      - 'fixtures/evidence-demo-1076/**'
      - 'fixtures/marketing-demo/**'
      - 'docs/images/marketing/e2e/**'
      - '.github/workflows/marketing-screenshots.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/src/**'
      - 'frontend/static/**'
      - 'frontend/package-lock.json'
      - 'frontend/tests/marketing-screenshots/**'
      - 'backend/src/**'
      - 'backend/pom.xml'
      - 'backend/skills/**'
      - 'official-plugins/**'
      - 'fixtures/evidence-demo-1076/**'
      - 'fixtures/marketing-demo/**'
      - 'docs/images/marketing/e2e/**'
      - '.github/workflows/marketing-screenshots.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: check 比对基线；update 只产出新截图 artifact
        type: choice
        options: [check, update]
        default: update

permissions:
  contents: read

concurrency:
  group: marketing-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Marketing screenshots
    # 固定镜像版本：基线与比对必须在同一套系统字体与图形栈上渲染
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SHOTS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
      SHOTS_BACKEND: http://127.0.0.1:9696
      SHOTS_PORT: '18930'
      SHOTS_OUT: ${{ github.workspace }}/marketing-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Chrome (puppeteer-core lockfile revision)
        working-directory: frontend
        run: |
          VER=$(node -e "import('./node_modules/puppeteer-core/lib/puppeteer/revisions.js').then(m => console.log(m.PUPPETEER_REVISIONS.chrome))")
          OUT=$(npx --no-install @puppeteer/browsers install "chrome@$VER" --path "$RUNNER_TEMP/browsers")
          echo "$OUT"
          echo "PUPPETEER_EXECUTABLE_PATH=$(echo "$OUT" | tail -n1 | awk '{print $2}')" >> "$GITHUB_ENV"
      # build:plugins 会重写 official-plugins/*/web/，后端启动时装随包插件要校验它；
      # 两者并发会撞上写到一半的 web/ 直接启动失败，所以先构建、再起后端
      - name: Build H5
        working-directory: frontend
        run: npm run build:h5
      - name: Build backend jar
        run: |
          mvn -B -q -f backend/plugin-api/pom.xml install
          mvn -B -q -DskipTests -f backend/pom.xml package
      - name: Start fresh local-mode backend
        run: |
          H="$RUNNER_TEMP/awd-home"
          mkdir -p "$H/cwd"
          cp backend/target/backend-0.0.1-SNAPSHOT.jar "$H/app.jar"
          cd "$H/cwd"
          SPRING_PROFILES_ACTIVE=desktop SERVER_PORT=9696 \
          SPRING_DATASOURCE_URL="jdbc:h2:file:$H/db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE" \
          AI_SKILLS_BUILTIN_DIR="$GITHUB_WORKSPACE/backend/skills" \
          AI_PLUGINS_BUNDLED_DIR="$GITHUB_WORKSPACE/official-plugins" \
          AWD_APP_VERSION="$(node -p "require('$GITHUB_WORKSPACE/desktop/package.json').version")" \
          AI_SKILLS_REGISTRYURL="http://127.0.0.1:$SHOTS_PORT/registry/skills" \
          AI_PLUGINS_REGISTRYURL="http://127.0.0.1:$SHOTS_PORT/registry/plugins" \
          nohup java -Duser.home="$H" -jar "$H/app.jar" > "$H/stdout.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf "$SHOTS_BACKEND/api/auth/me" > /dev/null && exit 0
            sleep 2
          done
          tail -n 80 "$H/stdout.log"
          exit 1
      - name: Capture and compare
        working-directory: frontend
        run: node tests/marketing-screenshots/run.mjs
      - name: Backend log on failure
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/awd-home/stdout.log" || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-screenshots
          path: marketing-shots/
          if-no-files-found: warn
          retention-days: 14
