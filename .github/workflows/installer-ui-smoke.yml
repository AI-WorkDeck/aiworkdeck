name: Windows dependency acceptance replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require identical product payload to the saved installer
        shell: pwsh
        run: |
          $changed = @(git diff --name-only 1c0b5cb3d195b5f3283ac4e55f3e8f811f5c9743 HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare installer source' }
          $productChanges = @($changed | Where-Object { $_ -notmatch '^([.]github/workflows/|desktop/tests/|desktop/scripts/dependency-clean-windows/|asr-service/tests/|doc/)' })
          if ($productChanges.Count) { throw "Installer payload differs: $productChanges" }
      - uses: actions/download-artifact@v4
        with:
          name: windows-pr-dependency-installer
          path: installer
          run-id: 39547120278
          github-token: ${{ github.token }}
      # javac is preparation-only; the standard-user probe uses the installed trimmed JRE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and exercise real dependencies in isolated standard account
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem installer -Filter *.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one PR installer' }
          ./desktop/scripts/dependency-clean-windows/run.ps1 -Installer $installer[0].FullName -OutDir "$env:RUNNER_TEMP/dependency-evidence"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-windows-dependency-evidence
          path: ${{ runner.temp }}/dependency-evidence
          retention-days: 7
          if-no-files-found: warn
