# TEMPORARY branch-only QA relay, dev-board#1367. Never merge this replacement.
# This existing default-branch workflow filename permits manual --ref dispatch.
name: qa-candidate-private-relay-1367
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  relay:
    if: github.repository == 'AI-WorkDeck/aiworkdeck' && github.ref == 'refs/heads/codex/qa-candidate-relay-1367'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download only the two pinned official Mac build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p evidence
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          repo = 'AI-WorkDeck/aiworkdeck'
          builds = [
              ('39213434701', '109ebe48b97630bb336a8dd60c691420c9b855a9', '0.65.0'),
              ('39214022951', 'a1fa26317270df303b99b99fe1735460b236e8b7', '0.66.0'),
          ]
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'awd-qa-1367-relay'
          work.mkdir(mode=0o700)
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          for run_id, sha, version in builds:
              run = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
              assert run['repository']['full_name'] == repo
              assert run['head_sha'] == sha and run['event'] == 'workflow_dispatch'
              assert run['path'] == '.github/workflows/desktop-build.yml'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              artifacts = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}/artifacts'))['artifacts']
              artifacts = [a for a in artifacts if a['name'] == 'aiworkdeck-macos-latest' and not a['expired']]
              assert len(artifacts) == 1
              artifact = artifacts[0]
              destination = work / run_id
              subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo,
                              '--name', artifact['name'], '--dir', str(destination)], check=True)
              dmgs = list(destination.rglob('*.dmg'))
              assert len(dmgs) == 1 and dmgs[0].is_file() and not dmgs[0].is_symlink()
              original_name = dmgs[0].name
              assert version in original_name and 'arm64' in original_name
              installer = destination / 'installer.dmg'
              dmgs[0].rename(installer)
              digest = hashlib.file_digest(installer.open('rb'), 'sha256').hexdigest()
              provenance = {
                  'purpose': 'dev-board#1367 private QA transfer; not a deployment',
                  'repository': repo, 'runId': run_id, 'headSha': sha,
                  'event': run['event'], 'workflowPath': run['path'], 'conclusion': run['conclusion'],
                  'runUrl': run['html_url'], 'version': version,
                  'artifactId': artifact['id'], 'artifactName': artifact['name'],
                  'artifactDigest': artifact.get('digest'), 'originalFilename': original_name,
                  'size': installer.stat().st_size, 'sha256': digest,
                  'remoteDirectory': f'/tmp/awd-qa-1367/{run_id}',
                  'signatureEvidence': 'Official signed build provenance only; verify Developer ID/notarization on the receiving Mac',
              }
              data = json.dumps(provenance, indent=2) + '\n'
              (destination / 'provenance.json').write_text(data)
              pathlib.Path(f'evidence/{run_id}.json').write_text(data)
              print(json.dumps(provenance))
          pathlib.Path('evidence/CLEANUP.txt').write_text(
              'Private QA relay only. Do not move files into any web-served directory.\n'
              'After downloading each installer, verify its SHA256 against the matching provenance JSON.\n'
              'On the mirror host remove only these exact files (including a partial upload after failure), then rmdir the two run directories and parent:\n'
              + ''.join(f'/tmp/awd-qa-1367/{run_id}/{name}\n' for run_id, _, _ in builds
                        for name in ['installer.dmg', 'installer.dmg.partial', 'provenance.json'])
              + 'Delete remote Git branch codex/qa-candidate-relay-1367 after retrieval; do not merge its workflow replacement.\n'
              'Runner SSH key and downloaded files are ephemeral; the workflow deletes its temporary SSH key on exit.\n')
          PYTHON
      - name: Transfer to private task directories using existing mirror credentials
        env:
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # Beijing identity from EXTERNAL_SERVICES.md / ACCOUNTS.md; ED25519
          # fingerprint already trusted in maintainer known_hosts, checked 2026-10-19.
          test "$MIRROR_HOST" = '8.152.169.44'
          test -n "$MIRROR_SSH_KEY"
          key="$RUNNER_TEMP/awd-qa-1367-ssh-key"
          hosts="$RUNNER_TEMP/awd-qa-1367-known-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 15 -t ed25519 "$MIRROR_HOST" > "$hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')" = 'SHA256:itboT6XLi9D58vPUNzMYOepCXRNSryMgvIUpPXJVTnY'
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=6)
          ssh "${opts[@]}" "root@$MIRROR_HOST" 'set -eu; umask 077; base=/tmp/awd-qa-1367; if [ -e "$base" ] || [ -L "$base" ]; then test -d "$base" && test ! -L "$base" && test "$(stat -c %u "$base")" = 0 && test "$(stat -c %a "$base")" = 700; else mkdir -m 700 "$base"; fi'
          for id in 39213434701 39214022951; do
            source="$RUNNER_TEMP/awd-qa-1367-relay/$id"
            dest="/tmp/awd-qa-1367/$id"
            expected=$(sha256sum "$source/installer.dmg" | awk '{print $1}')
            # Exclusive mkdir deliberately refuses stale/partial task directories.
            # Reruns require explicitly cleaning this task's recorded files first.
            ssh "${opts[@]}" "root@$MIRROR_HOST" "umask 077; mkdir -m 700 '$dest'"
            scp "${opts[@]}" "$source/installer.dmg" "root@$MIRROR_HOST:$dest/installer.dmg.partial"
            got=$(ssh "${opts[@]}" "root@$MIRROR_HOST" "sha256sum '$dest/installer.dmg.partial'" | awk '{print $1}')
            test "$got" = "$expected"
            ssh "${opts[@]}" "root@$MIRROR_HOST" "set -eu; chmod 600 '$dest/installer.dmg.partial'; mv '$dest/installer.dmg.partial' '$dest/installer.dmg'"
            scp "${opts[@]}" "$source/provenance.json" "root@$MIRROR_HOST:$dest/provenance.json"
            ssh "${opts[@]}" "root@$MIRROR_HOST" "set -eu; chmod 600 '$dest/provenance.json'; test \"\$(stat -c %a '$dest')\" = 700; sha256sum '$dest/installer.dmg' '$dest/provenance.json'" > "evidence/$id-remote-sha256.txt"
            expected_meta=$(sha256sum "$source/provenance.json" | awk '{print $1}')
            got_meta=$(awk 'NR==2 {print $1}' "evidence/$id-remote-sha256.txt")
            test "$got_meta" = "$expected_meta"
            cat "evidence/$id-remote-sha256.txt"
          done
      - name: Save only provenance, transfer hashes and task cleanup instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-private-relay-1367-metadata
          path: evidence/
          retention-days: 3
          if-no-files-found: error
