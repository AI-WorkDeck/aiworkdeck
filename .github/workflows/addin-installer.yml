# NEVER MERGE: temporary native-drag acceptance, not an Office installer build.
name: temporary-mac-product-native-drag
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-drag:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real signed candidate, CGEvent drag and AppKit file receiver
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: '39222690909'
          CANDIDATE_SHA: '11516bc1aa8b43f99b29bf6515a90f7ecdd78ced'
        run: node desktop/scripts/test-native-drag-mac.mjs
      - name: Preserve signatures, screenshots, receipts and process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-product-native-drag-${{ github.run_attempt }}
          path: evidence/mac-native-drag/
          retention-days: 7
          if-no-files-found: error
