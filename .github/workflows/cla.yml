name: "CLA Assistant"

# 自包含的 CLA 检查（替代已归档的 contributor-assistant/github-action）。
# - pull_request：只读检查 PR 的提交作者是否在白名单或已签署（不 checkout、不执行 PR 代码）
# - issue_comment：贡献者评论签署语句后，把签名追加到 cla-signatures 分支并重跑检查
# 说明：本文件只通过 GitHub API 工作，全程不 checkout 仓库，也不把评论/PR 内容插值进脚本。
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    # fork PR 的 pull_request 令牌天然只读；评论签署路径只在 issue_comment（默认分支的工作流文件）上运行
    permissions:
      actions: write        # 签署后重跑 PR 上的检查
      contents: write       # 向 cla-signatures 分支写入签名
      pull-requests: read
    steps:
      - name: "Check CLA"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const allowlist = ['zeweihan', 'claude', '*[bot]'];
            const allowed = (login) => allowlist.some((p) =>
              p.startsWith('*') ? login.endsWith(p.slice(1)) : login === p);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;

            const commits = await github.paginate(github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr, per_page: 100 });
            // 与原 action 一致：取提交作者（无 GitHub 账号时退回提交者/姓名），不统计 Co-authored-by
            const authors = new Map();
            for (const c of commits) {
              const u = c.author || c.committer;
              const key = u ? u.login : c.commit.author.name;
              authors.set(key, u ? u.id : null);
            }

            let signed = [];
            try {
              const f = await github.rest.repos.getContent({ owner, repo,
                path: 'signatures/version1/cla.json', ref: 'cla-signatures' });
              signed = JSON.parse(Buffer.from(f.data.content, 'base64').toString()).signedContributors || [];
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const missing = [...authors].filter(([login, id]) =>
              !allowed(login) && !(id && signed.some((s) => s.id === id)));
            if (missing.length === 0) {
              core.info(`CLA OK: ${[...authors.keys()].join(', ')}`);
              return;
            }
            const names = missing.map(([l]) => '@' + l).join(', ');
            const msg = `以下提交作者尚未签署 CLA：${names}。请阅读 https://github.com/${owner}/${repo}/blob/master/legal/CLA.md ，` +
              `然后在本 PR 下评论：I have read the CLA Document and I hereby sign the CLA（签署后检查会自动重跑，也可评论 recheck）。`;
            await core.summary.addRaw(msg).write();
            core.setFailed(msg);

      - name: "Record signature / recheck"
        if: >-
          github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const comment = context.payload.comment;
            const path = 'signatures/version1/cla.json';
            const branch = 'cla-signatures';

            if (comment.body !== 'recheck' && comment.user.type !== 'Bot') {
              for (let attempt = 0; attempt < 5; attempt++) {
                let sha, data = { signedContributors: [] };
                try {
                  const f = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                  sha = f.data.sha;
                  data = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                if (data.signedContributors.some((s) => s.id === comment.user.id)) break;
                data.signedContributors.push({
                  name: comment.user.login,
                  id: comment.user.id,
                  comment_id: comment.id,
                  created_at: comment.created_at,
                  repoId: context.payload.repository.id,
                  pullRequestNo: number,
                });
                try {
                  await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, sha,
                    message: `@${comment.user.login} has signed the CLA from PR #${number}`,
                    content: Buffer.from(JSON.stringify(data, null, 2) + '\n').toString('base64') });
                  break;
                } catch (e) {
                  if ((e.status !== 409 && e.status !== 422) || attempt === 4) throw e;
                }
              }
            }

            // 重跑该 PR 最近一次 CLA 检查
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const { data: runs } = await github.rest.actions.listWorkflowRuns({ owner, repo,
              workflow_id: 'cla.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 1 });
            if (runs.workflow_runs.length) {
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: runs.workflow_runs[0].id });
            } else {
              core.warning('没有找到该提交上的 CLA 检查运行，请推送新提交以触发。');
            }
