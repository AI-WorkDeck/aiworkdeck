name: Runtime frame observation (no publishing)
on:
  push:
    branches: [codex/runtime-frame-observe-1643]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        probe: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build frontend (formal build preconditions)
        working-directory: frontend
        shell: bash
        run: |
          npm ci || npm install
          npm run build:h5
          test -s dist/build/h5/index.html
          npm run build:zetaoffice
      - name: Bake LOWA runtime and CJK font (formal build preconditions)
        shell: bash
        env:
          LOWA_BASE_URL: https://www.aiworkdeck.com/lowa-engine/24.2.8-zhcn-r7/
        run: |
          node desktop/scripts/fetch-lowa-assets.js
          ls -la frontend/dist/zetaoffice/lowa frontend/dist/zetaoffice/cjk.ttc
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop unit tests (full formal suite)
        working-directory: desktop
        timeout-minutes: 15
        run: npm test
      - name: Observe the first Electron process without foreground intervention
        env:
          AWD_CAPTURE_DIAGNOSTICS: '1'
        run: npm --prefix desktop run test:runtime-compat
      - name: Preserve original failure and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-frame-observation-${{ matrix.probe }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/awd-runtime-compat-*/*.json
            ${{ runner.temp }}/awd-runtime-compat-*/*.png
