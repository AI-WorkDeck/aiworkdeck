#
# 真实模型 A/B 矩阵（scripts/eval/model-matrix.mjs），只手动触发。
# 目的：国内开发机访问不到 OpenRouter 上 Google/Anthropic/OpenAI 的模型（403 地域），intl 档位只能在 GitHub 美国 runner 上跑。
# 会产生真实模型费用（intl cheap 门禁约 12 美元），所以绝不挂在 pull_request / push 上。
name: Model matrix
on:
  workflow_dispatch:
    inputs:
      profile:
        description: '站点/语言档位'
        type: choice
        options: [intl, cn]
        default: intl
      tier:
        description: '模型档（cheap 日常门禁；release 加贵模型）'
        type: choice
        options: [cheap, release]
        default: cheap
      before:
        description: 'BEFORE 的 git ref（分支/tag/SHA）'
        type: string
        default: master
      after:
        description: 'AFTER 的 git ref（分支/tag/SHA），必填'
        type: string
        required: true
      sentences:
        description: '句子集路径（留空 = 该档位的门禁集）'
        type: string
        default: ''
      runs:
        description: '每句重复次数'
        type: string
        default: '3'
      models:
        description: '逗号分隔的 OpenRouter 模型 id（留空 = 该档位默认）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: model-matrix
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # 与 desktop-build.yml 相同的自建 zh-CN LOWA 引擎（脚本在缓存缺失时经 fetch-lowa-assets.js 拉取）
      LOWA_BASE_URL: https://www.aiworkdeck.com/lowa-engine/24.2.8-zhcn-r8/
    steps:
      # 脚本取默认分支的版本；被测的 before/after 是 git ref，由脚本自己建临时 worktree，所以要完整历史。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Resolve refs
        id: refs
        env:
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail
          resolve() {
            if git rev-parse --verify --quiet "origin/$1^{commit}" >/dev/null; then git rev-parse "origin/$1^{commit}"
            else git rev-parse --verify "$1^{commit}"; fi
          }
          echo "before=$(resolve "$BEFORE")" >> "$GITHUB_OUTPUT"
          echo "after=$(resolve "$AFTER")" >> "$GITHUB_OUTPUT"
      - name: Install PostgreSQL 17 (temp clusters are created by the script)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          # 包安装会自动起一个 5432 集群，用不上
          sudo systemctl stop postgresql || true
          /usr/lib/postgresql/17/bin/initdb --version
      - name: Cache LOWA runtime and Playwright wrapper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/awd-matrix
            ~/.cache/ms-playwright
          key: awd-matrix-${{ runner.os }}-${{ env.LOWA_BASE_URL }}-pw1.65
      - name: Cache npm (frontend of both refs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: awd-matrix-npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: awd-matrix-npm-${{ runner.os }}-
      - name: Install Playwright Chromium (editor sentences)
        run: |
          set -euo pipefail
          # 与脚本 loadPlaywright() 同一目录；这里额外装系统依赖（脚本自己只装浏览器）
          d="$HOME/.cache/awd-matrix/pw"
          mkdir -p "$d"
          npm install --no-audit --no-fund --prefix "$d" playwright@1.65
          npx --prefix "$d" playwright install --with-deps chromium
      - name: Install plugin-api (host SPI, local artifact)
        run: mvn -B -q -f backend/plugin-api/pom.xml install -DskipTests
      - name: Run model matrix
        env:
          # 只在这一步注入；脚本只把它传给后端子进程，不打印。
          OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}
          PROFILE: ${{ inputs.profile }}
          TIER: ${{ inputs.tier }}
          BEFORE_SHA: ${{ steps.refs.outputs.before }}
          AFTER_SHA: ${{ steps.refs.outputs.after }}
          SENTENCES: ${{ inputs.sentences }}
          RUNS: ${{ inputs.runs }}
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          args=(--before "$BEFORE_SHA" --after "$AFTER_SHA" --profile "$PROFILE" --tier "$TIER" --runs "$RUNS" --concurrency 4)
          [ -n "$SENTENCES" ] && args+=(--sentences "$SENTENCES")
          [ -n "$MODELS" ] && args+=(--models "$MODELS")
          node scripts/eval/model-matrix.mjs "${args[@]}"
      - name: Job summary
        if: always()
        run: |
          r=$(ls -d scripts/eval/out/*/ 2>/dev/null | sort | tail -1 || true)
          if [ -n "$r" ] && [ -f "$r/report.md" ]; then cat "$r/report.md" >> "$GITHUB_STEP_SUMMARY"
          else echo "未生成 report.md，见步骤日志。" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-matrix-${{ inputs.profile }}-${{ inputs.tier }}
          path: scripts/eval/out/**
          if-no-files-found: warn
          retention-days: 30
